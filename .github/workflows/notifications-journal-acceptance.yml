name: VALYQON Delivery Journal Acceptance

on:
  push:
    branches:
      - feat/notifications-delivery-journal-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-api-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CI: 'true'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Python and browser script syntax
        run: |
          python -m compileall -q app tests/test_delivery_journal.py
          node --check app/api/static/delivery_journal.js
      - name: Validate real SQLite receipts, tenant isolation and HTTP route
        run: |
          python -m pytest -q tests/test_delivery_journal.py tests/test_deadline_alerts_database.py tests/test_deadline_alerts_launch.py
      - name: Confirm no accidental UI or review regressions
        run: |
          python -m pytest -q tests/test_team_decision_ui.py tests/test_tender_planner_ui.py tests/test_workspace_home_workbench.py
