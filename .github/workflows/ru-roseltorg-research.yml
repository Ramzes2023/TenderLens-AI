name: RU Roseltorg research offline contracts
on:
  push:
    branches: [work/ru-sources-continuation-20261016]
    paths:
      - app/sources/roseltorg_public_research.py
      - tests/test_ru_roseltorg_public_research.py
      - .github/workflows/ru-roseltorg-research.yml
  pull_request:
    branches: [main]
    paths:
      - app/sources/roseltorg_public_research.py
      - tests/test_ru_roseltorg_public_research.py
      - .github/workflows/ru-roseltorg-research.yml
permissions:
  contents: read
jobs:
  roseltorg-offline-research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate fail-closed public detail evidence
        run: python -m pytest -q tests/test_ru_roseltorg_public_research.py
