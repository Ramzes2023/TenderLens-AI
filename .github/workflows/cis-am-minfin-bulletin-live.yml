name: CIS Armenia independent official bulletin regional discovery
on:
  push:
    branches: [research/cis-am-official-bulletin-20261018]
    paths:
      - scripts/ci_cis_am_minfin_bulletin_probe.py
      - .github/workflows/cis-am-minfin-bulletin-live.yml
permissions:
  contents: read
jobs:
  official-armenian-municipal-bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify official HTTPS HTML document/date structure without production activation
        env:
          PYTHON_DOTENV_DISABLED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m scripts.ci_cis_am_minfin_bulletin_probe
