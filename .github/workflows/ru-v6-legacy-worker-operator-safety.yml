name: RU V6 existing image read-only operator script safety
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/VALYQON-V6-LENOBL-EXISTING-IMAGE-READONLY.ps1
      - scripts/VALYQON-V6-LENOBL-TEMP-WORKER-READONLY.ps1
      - tests/test_v6_lenobl_disposable_worker_operator_safety.py
      - .github/workflows/ru-v6-legacy-worker-operator-safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-parser-only:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PowerShell and enforce read-only boundaries
        shell: pwsh
        run: |
          $file = 'scripts/VALYQON-V6-LENOBL-EXISTING-IMAGE-READONLY.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -ne 0) { throw "POWERSHELL_SYNTAX_INVALID=$($errors.Count)" }
          $source = Get-Content -LiteralPath $file -Raw -Encoding UTF8
          foreach ($required in @('StrictHostKeyChecking=yes', 'BatchMode=yes', 'mode=ro',
                                  "--filter 'label=com.docker.compose.service=worker-v6'",
                                  'V6_PRIMARY_LABEL_MATCH_COUNT',
                                  'EXACT_INVENTORIED_WORKER_V6',
                                  'BLOCKED_NOT_FOUND',
                                  'VALYQON_CONNECTOR_MAX_RECORDS', 'max_requests=4',
                                  'TELEGRAM_SEND_AUTHORIZED=NO', 'PRODUCTION_CHANGED=NO',
                                  'ProcessStartInfo', 'StandardInput.Write($remoteLf)',
                                  'RedirectStandardOutput = $true',
                                  'RedirectStandardError = $true',
                                  'V6_REMOTE_STDERR_PRESENT=YES_REDACTED',
                                  'BLOCKED_IMAGE_NOT_VERIFIED',
                                  'LEGACY_INPROCESS_THREE_DETAILS',
                                  'BLOCKED_UNEXPECTED_LEGACY_ADAPTER',
                                  'lenobl_runtime.MAX_DETAILS = 3')) {
            if (-not $source.Contains($required)) { throw "READONLY_BOUNDARY_MISSING=$required" }
          }
          foreach ($forbidden in @('docker compose up', 'docker restart', 'docker rm',
                                   'git reset --hard', 'telegram.send', 'sqlite3.connect(DB_PATH)',
                                   '$remote | & $ssh', "--filter 'label=com.docker.compose.service=worker'",
                                   'V6_PINNED_IMAGE_WORKER_MATCH_COUNT=')) {
            if ($source.Contains($forbidden)) { throw "UNSAFE_OPERATOR_ACTION=$forbidden" }
          }
          Write-Output 'POWERSHELL_READONLY_CONTRACT=PASS'
          Write-Output 'ACTUAL_VPS_PROBE=NOT_EXECUTED'
          Write-Output 'PRODUCTION_CHANGED=NO'


      - name: Parse disposable Worker PowerShell and reject unsafe commands
        shell: pwsh
        run: |
          $file = 'scripts/VALYQON-V6-LENOBL-TEMP-WORKER-READONLY.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -ne 0) { throw "TEMP_WORKER_POWERSHELL_SYNTAX_INVALID=$($errors.Count)" }
          $source = Get-Content -LiteralPath $file -Raw -Encoding UTF8
          foreach ($required in @('label=com.docker.compose.service=worker-v6',
                                  'valyqon-public-sources:v6-fe4c66bbd553',
                                  'LEGACY_INPROCESS_THREE_DETAILS',
                                  'TemporaryDirectory(', 'dir="/tmp"',
                                  'ConnectorSyncHandler(catalog, store, max_records=3)',
                                  'V6_LENOBL_TEMP_WORKER_COUNTS=',
                                  'TELEGRAM_SEND_AUTHORIZED', 'PRODUCTION_CHANGED')) {
            if (-not $source.Contains($required)) { throw "TEMP_WORKER_BOUNDARY_MISSING=$required" }
          }
          foreach ($forbidden in @('docker compose up', 'docker restart',
                                   'docker rm', 'git reset --hard',
                                   'sqlite3.connect(DB_PATH)', 'telegram.send')) {
            if ($source.Contains($forbidden)) { throw "TEMP_WORKER_UNSAFE_OPERATION=$forbidden" }
          }
          Write-Output 'V6_DISPOSABLE_WORKER_POWERSHELL_PARSE=PASS'
          Write-Output 'ACTUAL_VPS_PROBE=NOT_EXECUTED'

      - name: Prove LF-only heredoc reaches a fake SSH process (no network)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mockSource = Join-Path $env:RUNNER_TEMP 'mock_ssh.cs'
          $mockExe = Join-Path $env:RUNNER_TEMP 'ssh.exe'
          @'
          using System;
          using System.IO;
          using System.Text;
          public class MockSsh {
              public static int Main(string[] args) {
                  using (var stream = new MemoryStream()) {
                      Console.OpenStandardInput().CopyTo(stream);
                      byte[] data = stream.ToArray();
                      if (data.Length < 32 || data[0] != 0x73 || data[1] != 0x65) return 21;
                      foreach (byte item in data) if (item == 13) return 22;
                      string payload = Encoding.ASCII.GetString(data);
                      if (!payload.StartsWith("set -eu" + (char)10) ||
                          !payload.EndsWith(((char)10).ToString() + "PY" + (char)10) ||
                          !payload.Contains("label=com.docker.compose.service=worker-v6'") ||
                          !payload.Contains("valyqon-public-sources:v6-fe4c66bbd553")) return 23;
                      Console.WriteLine("MOCK_SSH_LF_ONLY_HEREDOC=PASS");
                      if (Environment.GetEnvironmentVariable("VALYQON_TEST_SSH_EXIT") == "2") {
                          Console.WriteLine("V6_SHELL_EXECUTED=YES");
                          Console.WriteLine("V6_EXACT_WORKER=BLOCKED_NOT_UNIQUE");
                          Console.WriteLine("PRODUCTION_CHANGED=NO");
                          Console.Error.WriteLine("confidential remote error not for forwarding");
                          return 2;
                      }
                      Console.WriteLine("V6_SHELL_EXECUTED=YES");
                      Console.WriteLine("PRODUCTION_CHANGED=NO");
                      return 0;
                  }
              }
          }
          '@ | Set-Content -LiteralPath $mockSource -Encoding utf8
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) { throw 'MOCK_CSC_NOT_FOUND' }
          & $csc /nologo ('/out:' + $mockExe) $mockSource
          if ($LASTEXITCODE -ne 0) { throw 'MOCK_SSH_COMPILE_FAILED' }
          $fakeKey = Join-Path $env:RUNNER_TEMP 'fake-test-key'
          'CI offline dummy, NOT a private key' | Set-Content -LiteralPath $fakeKey
          $env:PATH = "$env:RUNNER_TEMP;$env:PATH"
          $ok = @( & ./scripts/VALYQON-V6-LENOBL-EXISTING-IMAGE-READONLY.ps1 -Target 'ubuntu@127.0.0.1' -IdentityFile $fakeKey )
          if ('V6_SHELL_EXECUTED=YES' -notin $ok) { throw 'MOCK_SSH_SUCCESS_STATUS_NOT_VISIBLE' }
          $env:VALYQON_TEST_SSH_EXIT = '2'
          $seen = New-Object 'System.Collections.Generic.List[string]'
          try {
            & ./scripts/VALYQON-V6-LENOBL-EXISTING-IMAGE-READONLY.ps1 -Target 'ubuntu@127.0.0.1' -IdentityFile $fakeKey | ForEach-Object { $seen.Add([string]$_) }
            throw 'MOCK_SSH_FAILURE_WAS_NOT_REJECTED'
          } catch {
            if ($_.Exception.Message -notlike '*READONLY_V6_DIAGNOSTIC_EXIT=2*') { throw }
          } finally {
            Remove-Item Env:VALYQON_TEST_SSH_EXIT -ErrorAction SilentlyContinue
          }
          if (-not $seen.Contains('V6_EXACT_WORKER=BLOCKED_NOT_UNIQUE')) {
            throw 'MOCK_SSH_FAILURE_CAUSE_NOT_VISIBLE'
          }
          if (-not $seen.Contains('V6_REMOTE_STDERR_PRESENT=YES_REDACTED')) {
            throw 'MOCK_SSH_STDERR_REDACTION_MISSING'
          }
          if (($seen | Out-String).Contains('confidential remote error')) {
            throw 'MOCK_SSH_STDERR_LEAK'
          }
          Write-Output 'MOCK_SSH_BLOCKER_REPORTED_SAFELY=PASS'
          Write-Output 'SSH_NETWORK_CALLS=ZERO'
          Write-Output 'PRODUCTION_CHANGED=NO'

  offline-docker-label-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exact isolated worker selection using fake docker only
        run: python3 -B -m unittest -v tests.test_ru_v6_worker_selection_offline

  disposable-worker-offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify disposable Worker shell and Python without Docker/network
        run: python3 -B -m unittest -v tests.test_v6_lenobl_disposable_worker_operator_safety
