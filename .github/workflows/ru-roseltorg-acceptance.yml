name: RU Roseltorg strict public source offline contracts
on:
  push:
    branches: [feat/ru-roseltorg-real-gated-20261016]
    paths:
      - app/sources/roseltorg_public.py
      - tests/test_ru_roseltorg_public.py
      - scripts/ci_ru_roseltorg_real_worker.py
      - .github/workflows/ru-roseltorg-acceptance.yml
  pull_request:
    branches: [main]
    paths:
      - app/sources/roseltorg_public.py
      - tests/test_ru_roseltorg_public.py
      - scripts/ci_ru_roseltorg_real_worker.py
      - .github/workflows/ru-roseltorg-acceptance.yml
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/scoring/runs.py
      - app/monitoring/config.py
permissions:
  contents: read
jobs:
  roseltorg-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reject unsafe URLs, identity mismatches and synthetic unverified cards
        run: python -m pytest -q tests/test_ru_roseltorg_public.py
