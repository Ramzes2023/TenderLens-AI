name: RU Ingushetia only - original EIS 44-FZ Worker SQL acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "app/sources/ru_ingushetia_*.py"
      - "app/sources/eis_pinned_ca.py"
      - "app/sources/catalog.py"
      - "app/sources/ingestion.py"
      - "app/monitoring/config.py"
      - "app/sources/ru_notice_identity.py"
      - "scripts/ci_ru_ingushetia_*.py"
      - "scripts/ru_ingushetia_telegram_test.py"
      - "tests/test_ru_ingushetia_*.py"
      - ".github/workflows/ru-ingushetia-only-main.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingushetia-standalone-strict-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Ingushetia adapter, original identity, SQL and alert safety contracts
        run: python -m pytest -q tests/test_ru_ingushetia_eis44.py tests/test_ru_ingushetia_fabrikant44.py tests/test_ru_ingushetia_telegram_test.py tests/test_ru_source_integration_contract.py tests/test_ru_original_notice_identity.py tests/test_ru_tenders_confirmed_send.py tests/test_source_catalog.py tests/test_connector_workers.py
  ingushetia-standalone-real-worker:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Exact official EIS or accredited first-party latest list, original detail, fenced Worker, disposable SQL, user search and isolated alert
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_ingushetia_live_worker
