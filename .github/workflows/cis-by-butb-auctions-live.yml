name: CIS Belarus BUTB public exchange auctions acceptance

on:
  push:
    branches:
      - research/cis-by-butb-auctions-20261016
    paths:
      - scripts/ci_cis_by_butb_live.py
      - .github/workflows/cis-by-butb-auctions-live.yml
  pull_request:
    paths:
      - scripts/ci_cis_by_butb_live.py
      - .github/workflows/cis-by-butb-auctions-live.yml

permissions:
  contents: read

jobs:
  official-belarus-butb-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require live government-authorized Belarus commodity exchange procurement
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/ci_cis_by_butb_live.py
