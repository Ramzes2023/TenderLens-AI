name: RU TEK-Torg source offline contracts

on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/tektorg_public_html.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/scoring/runs.py
      - tests/test_ru_tektorg_public.py
      - .github/workflows/ru-tektorg-integration.yml
  push:
    branches: [integration/ru-tektorg-mainline-20261016]
    paths:
      - app/sources/tektorg_public_html.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/scoring/runs.py
      - tests/test_ru_tektorg_public.py
      - .github/workflows/ru-tektorg-integration.yml

permissions:
  contents: read

jobs:
  tektorg-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned app test requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Strict source identity, exact-host detail, fail-closed and worker contracts
        run: python -m pytest -q tests/test_ru_tektorg_public.py
