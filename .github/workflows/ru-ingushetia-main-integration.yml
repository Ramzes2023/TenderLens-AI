name: RU Ingushetia clean current-main integration acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/sources/ru_ingushetia_eis44.py'
      - 'app/sources/ru_ingushetia_fabrikant44.py'
      - 'app/sources/eis_pinned_ca.py'
      - 'app/sources/catalog.py'
      - 'app/sources/ingestion.py'
      - 'app/monitoring/config.py'
      - 'app/sources/ru_cycle.py'
      - 'app/sources/ru_notice_identity.py'
      - 'tests/test_ru_ingushetia_main_integration.py'
      - 'tests/test_ru_approved_operator_cycle.py'
      - 'scripts/ci_ru_ingushetia_main_live.py'
      - '.github/workflows/ru-ingushetia-main-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-identity-and-worker-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Strict operator-only catalog, original identities, Worker SQLite
        run: python -m pytest -q tests/test_ru_ingushetia_main_integration.py tests/test_ru_approved_operator_cycle.py tests/test_ru_original_notice_identity.py tests/test_source_catalog.py tests/test_connector_workers.py
  actual-first-party-worker-search:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: First-party current originals to real leased Worker SQL and monitor (fail closed)
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_ingushetia_main_live
