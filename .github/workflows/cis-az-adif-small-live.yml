name: CIS Azerbaijan ADIF actual small quotations leased worker search
on:
  push:
    branches:
      - integration/cis-az-adif-public-small-20261018
    paths:
      - app/sources/az_adif_small.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - tests/test_cis_az_adif_small.py
      - tests/test_cis_az_adif_parser_replay.py
      - scripts/ci_cis_az_adif_small_live_acceptance.py
      - .github/workflows/cis-az-adif-small-live.yml
  pull_request:
    branches: [main]
    paths:
      - app/sources/az_adif_small.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - tests/test_cis_az_adif_small.py
      - tests/test_cis_az_adif_parser_replay.py
      - scripts/ci_cis_az_adif_small_live_acceptance.py
      - .github/workflows/cis-az-adif-small-live.yml
permissions:
  contents: read
jobs:
  adif-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require authentic title, original first-party specification, dates and disabled registration
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s tests -p test_cis_az_adif_small.py -v
          python -B -m pytest -q tests/test_cis_az_adif_parser_replay.py

  adif-real-quote-worker-query:
    needs: [adif-offline-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Real HTTPS official quotes into fenced lease, disposable SQLite, buyer title search
        timeout-minutes: 4
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHON_DOTENV_DISABLED: '1'
        run: python -B -m scripts.ci_cis_az_adif_small_live_acceptance --source az_adif_small
