name: VALYQON Gmail fallback candidate safety contracts

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ops/valyqon_gmail_fallback_candidate.ps1
      - tests/test_valyqon_gmail_fallback_candidate.py
      - docs/VALYQON_GMAIL_FALLBACK_CANDIDATE.md
      - .github/workflows/valyqon-gmail-fallback-contracts.yml

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q tests/test_valyqon_gmail_fallback_candidate.py
      - run: |
          echo "AWS_CONTACTED=NO"
          echo "CREDENTIALS_USED=NO"
          echo "EMAIL_SENT=NO"
          echo "PUBLIC_API_CHANGED=NO"
  ps-parser:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse Windows PowerShell syntax without executing the script
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $file = (Resolve-Path 'scripts/ops/valyqon_gmail_fallback_candidate.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $file, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Output 'POWERSHELL_PARSER=PASS'
          Write-Output 'NO_SSH_EXECUTED=YES'
          Write-Output 'NO_MAIL_SENT=YES'
