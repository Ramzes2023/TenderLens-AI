name: RU isolated STAN Lenobl release candidate security contracts
on:
  pull_request:
    branches: [main]
    paths:
      - ops/public_sources/compose.stan-lenobl-rc.yaml
      - tests/test_ru_stan_lenobl_rc_compose.py
      - tests/test_stan_lenobl_rc_guest_boot.py
      - app/api/isolated_public_sources.py
      - .github/workflows/ru-stan-lenobl-rc-compose.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-rc-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install strict YAML parser
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Prove no public ports, source DB mounts, sends or scheduler
        run: python3 -B -m unittest -v tests.test_ru_stan_lenobl_rc_compose
