name: RU Kavkaz.RF genuine first-party original procurement to fenced SQLite
on:
  push:
    branches: [feat/ru-kavkaz-rf-firstparty-originals-20261018]
    paths:
      - app/sources/kavkaz_rf_firstparty.py
      - app/sources/ingestion.py
      - tests/test_ru_kavkaz_rf_firstparty.py
      - tests/test_ru_kavkaz_firstparty_registration.py
      - app/monitoring/config.py
      - app/sources/catalog.py
      - scripts/ci_ru_kavkaz_real_worker.py
      - scripts/research_ru_kavkaz_live.py
      - .github/workflows/ru-kavkaz-rf-firstparty-live.yml
  pull_request:
    branches: [main]
    paths:
      - app/sources/kavkaz_rf_firstparty.py
      - tests/test_ru_kavkaz_rf_firstparty.py
      - tests/test_ru_kavkaz_firstparty_registration.py
      - scripts/ci_ru_kavkaz_real_worker.py
      - scripts/research_ru_kavkaz_live.py
  workflow_dispatch:

permissions:
  contents: read
jobs:
  kavkaz-rf-adversarial-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Strict origin, native procurement ID, price, dates and hostile HTML
        run: python -m pytest -q tests/test_ru_kavkaz_rf_firstparty.py tests/test_ru_kavkaz_firstparty_registration.py
  kavkaz-rf-two-real-originals-fenced-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Diagnose genuine source transport and independent original parser before worker
        timeout-minutes: 4
        run: python -B -m scripts.research_ru_kavkaz_live
      - name: Genuine corporate site current list and 2 independent native originals -> actual leased Worker -> disposable SQLite -> keyword query
        timeout-minutes: 5
        run: python -B -m scripts.ci_ru_kavkaz_real_worker
