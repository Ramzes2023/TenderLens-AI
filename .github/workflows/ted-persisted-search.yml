name: TED persisted-search live acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ted-persisted-search.yml"
      - "scripts/ci_ted_persisted_search.py"
      - "tests/test_ci_ted_persisted_search.py"
      - "app/sources/ted_api.py"
      - "app/sources/ingestion.py"
      - "app/sources/opportunities.py"
      - "app/sources/snapshots.py"
      - "app/database/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile acceptance without external calls
        run: python -m compileall -q scripts/ci_ted_persisted_search.py tests/test_ci_ted_persisted_search.py
      - name: Disposable DB and snapshot-search regressions
        run: python -m pytest -q tests/test_ci_ted_persisted_search.py

  live-ted-to-sqlite-search:
    needs: [offline-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Real public TED HTTPS to worker persistence and local search
        timeout-minutes: 3
        run: python -B scripts/ci_ted_persisted_search.py --live
