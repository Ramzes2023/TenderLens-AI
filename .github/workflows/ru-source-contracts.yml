name: Russian source contracts

on:
  # Avoid duplicating red raw-head checks for the same PR. Retain PR and main checks.
  push:
    branches:
      - main
    paths:
      - "app/sources/**"
      - "app/monitoring/config.py"
      - "tests/test_ru_source_integration_contract.py"
      - "scripts/ru_public_live_smoke.py"
      - "scripts/ru_public_platform_probe.py"
      - "scripts/ru_eis_system_ca_probe.py"
      - ".github/workflows/ru-source-contracts.yml"
  pull_request:
    paths:
      - "app/sources/**"
      - "app/monitoring/config.py"
      - "tests/test_ru_source_integration_contract.py"
      - "scripts/ru_public_live_smoke.py"
      - "scripts/ru_public_platform_probe.py"
      - "scripts/ru_eis_system_ca_probe.py"
      - ".github/workflows/ru-source-contracts.yml"

permissions:
  contents: read

jobs:
  ru-source-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile integrated Russian sources
        run: python -m compileall -q app/sources tests/test_ru_source_integration_contract.py
      - name: Test Russian source contracts (offline, no host proof)
        run: python -m pytest -q tests/test_ru_source_integration_contract.py
      - name: Check existing catalog worker and analytics contracts
        timeout-minutes: 3
        run: python -m pytest -q tests/test_source_catalog.py tests/test_connector_workers.py tests/test_analytics_dates.py tests/test_analytics_normalization.py
      - name: Public source to ephemeral SQLite and keyword search (observational, non-gating)
        timeout-minutes: 3
        run: python -m scripts.ru_public_live_smoke
      - name: Structural scan of public platform listings (observational only)
        timeout-minutes: 2
        run: python -m scripts.ru_public_platform_probe
      - name: Strict Linux system CA EIS network probe (observational only)
        timeout-minutes: 1
        run: python -m scripts.ru_eis_system_ca_probe

  ru-windows-system-ca-observation:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Windows strict TLS source-to-ephemeral-SQLite diagnostics (observational)
        timeout-minutes: 4
        run: python -m scripts.ru_public_live_smoke
