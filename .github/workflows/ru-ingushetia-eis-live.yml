name: RU Ingushetia verified EIS or accredited ETP original tenders (fail closed)
on:
  push:
    branches: [feat/ru-ingushetia-eis-live-gated-20261019]
    paths:
      - app/sources/ru_ingushetia_eis44.py
      - app/sources/ru_ingushetia_fabrikant44.py
      - app/sources/http_transport.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/sources/ru_dedup.py
      - app/sources/ru_notice_identity.py
      - app/monitoring/config.py
      - app/bot/monitoring.py
      - tests/test_ru_background_telegram_catalog.py
      - tests/test_ru_ingushetia_eis44.py
      - tests/test_ru_ingushetia_fabrikant44.py
      - tests/test_source_http_transport.py
      - tests/test_ru_ingushetia_independent_https_probe.py
      - scripts/ru_ingushetia_independent_https_probe.py
      - scripts/ci_ru_ingushetia_live_worker.py
      - scripts/ci_ru_ingushetia_fabrikant_worker.py
      - .github/workflows/ru-ingushetia-eis-live.yml
  pull_request:
    branches: [main, feat/ru-ingushetia-eis-live-gated-20261019]
permissions:
  contents: read
jobs:
  ingushetia-strict-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject unproven region, unsafe EIS URL and duplicate alerts
        run: python -m pytest -q tests/test_ru_ingushetia_eis44.py tests/test_ru_ingushetia_fabrikant44.py tests/test_ru_source_integration_contract.py tests/test_ru_original_notice_identity.py tests/test_ru_tenders_confirmed_send.py tests/test_ru_transport_diagnostics.py tests/test_ru_eis_scoped_cert.py tests/test_ru_ingushetia_telegram_test.py tests/test_ru_ingushetia_poll_audit.py tests/test_ru_background_telegram_catalog.py tests/test_source_http_transport.py tests/test_ru_ingushetia_independent_https_probe.py
  ingushetia-real-publisher-original-worker-search:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Two current genuine regional first-party original cards from verified EIS or ETP listing through Worker SQL search and isolated monitor
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_ingushetia_live_worker
