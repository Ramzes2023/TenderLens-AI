name: RU-03 EIS 223 official HTML search variant study

on:
  push:
    branches: [ops/ru3-trusted-source-probe-20261016]
    paths: [.github/workflows/ru03-eis223-html-variants.yml]

permissions: {}

jobs:
  verified-eis223:
    runs-on: valyqon-ru3
    timeout-minutes: 5
    steps:
      - name: Compare public 223 search options under pinned official CA
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = VALYQON-ASIA-03
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          for item in root sub; do
            case "$item" in
              root) file=russian_trusted_root_ca; pin=d26d2d0231b7c39f92cc738512ba54103519e4405d68b5bd703e9788ca8ecf31 ;;
              sub) file=russian_trusted_sub_ca; pin=bbbde2103e790b999ec62bd03cf625a5a2e7c316e10afe6a490eedead8b3fd9b ;;
            esac
            curl --noproxy '*' --fail --silent --show-error --proto '=https' --max-redirs 0 --connect-timeout 8 --max-time 20 --max-filesize 65536 -o "$dir/$item.crt" "https://gu-st.ru/content/Other/doc/$file.cer"
            openssl x509 -in "$dir/$item.crt" -out "$dir/$item.pem"
            fp="$(openssl x509 -in "$dir/$item.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test "$fp" = "$pin"
          done
          openssl verify -CAfile "$dir/root.pem" "$dir/sub.pem"
          cat "$dir/root.pem" "$dir/sub.pem" > "$dir/eis-only.pem"
          for variant in fz223only fz223mixed fz223off fz223full; do
            case "$variant" in
              fz223only) query='fz223=on&pageNumber=1' ;;
              fz223mixed) query='fz44=on&fz223=on&pageNumber=1' ;;
              fz223off) query='fz44=off&fz223=on&pageNumber=1' ;;
              fz223full) query='searchString=%D0%BF%D0%BE%D1%81%D1%82%D0%B0%D0%B2%D0%BA%D0%B0&morphology=on&search-filter=%D0%94%D0%B0%D1%82%D0%B5+%D1%80%D0%B0%D0%B7%D0%BC%D0%B5%D1%89%D0%B5%D0%BD%D0%B8%D1%8F&pageNumber=1&sortDirection=false&recordsPerPage=_10&showLotsInfoHidden=false&sortBy=UPDATE_DATE&fz44=on&fz223=on&af=on&ca=on&pc=on&pa=on&currencyIdGeneral=-1' ;;
            esac
            url="https://zakupki.gov.ru/epz/order/extendedsearch/results.html?$query"
            result="$(curl --noproxy '*' --silent --show-error --proto '=https' --cacert "$dir/eis-only.pem" --max-redirs 0 --connect-timeout 8 --max-time 20 --max-filesize 1200000 --output "$dir/$variant" --write-out '%{http_code} %{content_type}' "$url" 2>"$dir/curlerror")" && rc=0 || rc=$?
            echo "RU3_EIS223_VARIANT_$variant=$result;CURL_EXIT=$rc"
            if test "$rc" = 0 && test "${result%% *}" = 200; then
              python3 - "$dir/$variant" "$variant" <<'PY'
          import sys
          from html.parser import HTMLParser
          class Cards(HTMLParser):
              def __init__(self): super().__init__();self.depth=0;self.card=None;self.cards=[]
              def handle_starttag(self,tag,attrs):
                  if self.card is None and tag=='div' and 'search-registry-entry-block' in dict(attrs).get('class','').split():
                      self.card=[];self.depth=1
                  elif self.card is not None and tag=='div':self.depth+=1
              def handle_data(self,data):
                  if self.card is not None:self.card.append(data)
              def handle_endtag(self,tag):
                  if tag=='div' and self.card is not None:
                      self.depth-=1
                      if self.depth==0:self.cards.append(' '.join(' '.join(self.card).split()));self.card=None
          content=open(sys.argv[1],'rb').read().decode('utf-8','replace')
          cards=Cards();cards.feed(content)
          laws=[x.split(' ',1)[0] for x in cards.cards]
          print(f'RU3_EIS223_{sys.argv[2]}_CARDS={len(laws)};LAW_PREFIXES={laws}')
          PY
            fi
          done
          echo "EIS_223_REAL_NOTICE_VERIFIED=NO"
          echo "PRODUCTION_CHANGED=NO"
