name: Asia isolated application acceptance (RU-01)

# Explicitly reviewed branch-scoped source execution ONLY in a constrained
# disposable Docker container; never run arbitrary pull_request payloads.
on:
  push:
    branches:
      - feat/asia-public-procurement-six-20261015
    paths:
      - "app/sources/asia_public.py"
      - "app/sources/catalog.py"
      - "app/sources/asia_enqueue.py"
      - "app/sources/ingestion.py"
      - "tests/test_asia_public_sources.py"
      - "scripts/asia_six_live_acceptance.py"
      - ".github/workflows/asia-isolated-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asia-isolated-application:
    if: github.repository == 'Ramzes2023/TenderLens-AI' && github.ref == 'refs/heads/feat/asia-public-procurement-six-20261015'
    runs-on: valyqon-ru
    timeout-minutes: 40
    steps:
      - name: Verify dedicated runner, prohibit Windows drive mounts and root checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = "VALYQON-RU-01"
          test "$(uname -s)" = "Linux"
          test "$(id -u)" != "0"
          if mountpoint -q /mnt/c; then
            echo "ASIA_HOST_PRECHECK=WINDOWS_DRIVE_EXPOSED"
            exit 1
          fi
          if ! command -v docker >/dev/null 2>&1; then
            echo "ASIA_HOST_PRECHECK=DOCKER_CLI_UNAVAILABLE"
            exit 2
          fi
          if ! timeout 20s sg docker -c "docker info --format '{{.ServerVersion}}' >/dev/null" >/dev/null 2>&1; then
            echo "ASIA_HOST_PRECHECK=DOCKER_UNREACHABLE"
            exit 3
          fi
          echo "ASIA_HOST_PRECHECK=PASS"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
          fetch-depth: 0
      - name: Verify branch and dependency manifest are unchanged from main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/feat/asia-public-procurement-six-20261015"
          git diff --quiet HEAD origin/main -- requirements.txt requirements-dev.txt || {
            echo "ASIA_DEPENDENCY_MANIFEST_CHANGED=BLOCKED"
            exit 4
          }
          echo "ASIA_DEPENDENCY_MANIFEST=UNCHANGED_FROM_MAIN"
      - name: Create reviewed build recipe outside repo (no PR Dockerfile)
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/Dockerfile.asia-reviewed" <<'DOCKERFILE'
          FROM python:3.12-slim
          COPY requirements.txt requirements-dev.txt /deps/
          RUN python -m pip install --disable-pip-version-check --no-cache-dir -r /deps/requirements-dev.txt
          RUN groupadd -g 65534 sandboxgroup || true
          WORKDIR /workspace
          DOCKERFILE
          echo "ASIA_REVIEWED_DOCKERFILE=CREATED_OUTSIDE_PR"
      - name: Use anonymous Docker config for public base image
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asia-anonymous-docker-config"
          printf '{"auths":{}}\\n' > "$RUNNER_TEMP/asia-anonymous-docker-config/config.json"
          echo "ASIA_DOCKER_AUTHLESS_CONFIG=$RUNNER_TEMP/asia-anonymous-docker-config" >> "$GITHUB_ENV"
          echo "ASIA_PUBLIC_DOCKER_AUTH=ANONYMOUS_NO_WSL_CREDENTIAL_HELPER"
      - name: Build temporary dependency-only test image
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          export ASIA_TEST_IMAGE="valyqon-asia-verified:$(git rev-parse --short=12 HEAD)"
          echo "ASIA_TEST_IMAGE=$ASIA_TEST_IMAGE" >> "$GITHUB_ENV"
          quoted_image="$(printf '%q' "$ASIA_TEST_IMAGE")"
          quoted_dockerfile="$(printf '%q' "$RUNNER_TEMP/Dockerfile.asia-reviewed")"
          quoted_context="$(printf '%q' "$GITHUB_WORKSPACE")"
          quoted_config="$(printf '%q' "$ASIA_DOCKER_AUTHLESS_CONFIG")"
          timeout 1050s sg docker -c "DOCKER_CONFIG=$quoted_config docker build --progress=plain -f $quoted_dockerfile -t $quoted_image $quoted_context"
      - name: Offline contracts in read-only networkless constrained container
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          quoted_source="$(printf '%q' "$GITHUB_WORKSPACE")"
          quoted_image="$(printf '%q' "$ASIA_TEST_IMAGE")"
          timeout 420s sg docker -c "docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=512m --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 --volume $quoted_source:/workspace:ro --workdir /workspace $quoted_image python -m pytest -q -p no:cacheprovider tests/test_asia_public_sources.py tests/test_source_catalog.py tests/test_connector_workers.py tests/test_source_http.py tests/test_source_http_transport.py"
          echo "ASIA_ISOLATED_OFFLINE_CONTRACTS=PASS"
      - name: Real source adapter → disposable SQLite → keyword-search acceptance
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          quoted_source="$(printf '%q' "$GITHUB_WORKSPACE")"
          quoted_image="$(printf '%q' "$ASIA_TEST_IMAGE")"
          timeout 420s sg docker -c "docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=512m --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 --env VALYQON_ASIA_SOURCES_ENABLED=1 --volume $quoted_source:/workspace:ro --workdir /workspace $quoted_image python -m scripts.asia_six_live_acceptance"
          echo "ASIA_ISOLATED_REAL_SIX_SOURCES=PASS"
      - name: Clean up only this job's disposable image
        if: always()
        shell: bash
        run: |
          if test -n "${ASIA_TEST_IMAGE:-}"; then
            quoted_image="$(printf '%q' "$ASIA_TEST_IMAGE")"
            timeout 20s sg docker -c "docker image rm $quoted_image >/dev/null 2>&1" || true
          fi
          echo "ASIA_PRODUCTION_CHANGED=NO"
