name: RU Lenobl current original offer deadline research

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_lenobl_official_deadline.py
      - scripts/ci_ru_lenobl_current_open.py
      - app/sources/lenobl_small_public.py
      - app/api/public_source_deadline.py
      - tests/test_ru_lenobl_small_public.py
      - tests/test_research_ru_lenobl_official_deadline.py
      - .github/workflows/ru-lenobl-public-deadline-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-date-label-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEGRAM_BOT_TOKEN: ''
      OUTBOUND_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Offline date-label and hidden-value safeguards
        run: python -m pytest -q tests/test_research_ru_lenobl_official_deadline.py tests/test_ru_lenobl_small_public.py
      - name: Strict read-only live original list/detail to bounded date diagnostic
        timeout-minutes: 4
        run: python -B -m scripts.research_ru_lenobl_official_deadline
      - name: Require genuine current open original deadlines (no calendar fabrication)
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_lenobl_current_open
      - name: Genuine original to leased Worker to disposable SQL
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_lenobl_real_worker
      - name: This research does not enable or deploy this source
        run: |
          echo "RU_LENOBL_INGESTION_NOT_CHANGED=YES"
          echo "PUBLIC_SOURCE_CUTOVER=NO"
          echo "REAL_WORKER_AND_FUTURE_DEADLINE=STILL_REQUIRED"
