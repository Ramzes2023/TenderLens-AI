name: RU Fabrikant exact publisher regional list reachability

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_fabrikant_published_regional_routes.py
      - tests/test_research_ru_fabrikant_published_regional_routes.py
      - .github/workflows/ru-fabrikant-regional-published.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firstparty-published-list-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEGRAM_BOT_TOKEN: ''
      OUTBOUND_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Approved URLs, no host forgery, no false list-to-worker claims
        run: python -m pytest -q tests/test_research_ru_fabrikant_published_regional_routes.py
      - name: Genuine publisher region-filtered published catalogue on two hosts
        timeout-minutes: 5
        run: python -B -m scripts.research_ru_fabrikant_published_regional_routes
      - name: Individual originals and Worker remain separate release gates
        run: |
          echo "REGIONAL_SOURCES_ACTIVATED=NO"
          echo "WORKER_SQL_SEARCH=NOT_VERIFIED"
          echo "PRODUCTION_CHANGED=NO"
