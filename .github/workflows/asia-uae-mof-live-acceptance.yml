name: Asia UAE Ministry of Finance real public tender worker search
on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/uae_mof_rfqs.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - tests/test_uae_mof_rfqs.py
      - scripts/asia_uae_mof_real_worker.py
      - .github/workflows/asia-uae-mof-live-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asia-uae-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  uae-federal-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_uae_mof_rfqs.py tests/test_india_epublish.py tests/test_sg_gebiz_rss.py
  uae-federal-true-upstream-worker-sqlite-search:
    runs-on: ubuntu-latest
    needs: [uae-federal-offline-contracts]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: UAE MoF public official RFQ → Worker → ephemeral DB → keyword search
        env:
          VALYQON_ASIA_UAE_FEDERAL_ENABLED: '1'
        run: python -m scripts.asia_uae_mof_real_worker
