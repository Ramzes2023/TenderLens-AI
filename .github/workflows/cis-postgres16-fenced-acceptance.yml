name: CIS PostgreSQL 16 fenced-ingestion acceptance

on:
  pull_request:
    branches: [main, integration/cis-am-tj-20261015]
    paths:
      - "app/sources/**"
      - "app/jobs/**"
      - "app/database/**"
      - "scripts/ci_cis_postgres16_fenced_acceptance.py"
      - ".github/workflows/cis-postgres16-fenced-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cis-postgres16-fenced-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: valyqon_ci
          POSTGRES_PASSWORD: only-for-disposable-github-cis16
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U valyqon_ci -d postgres -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      PYTHON_DOTENV_DISABLED: '1'
      VALYQON_DATABASE_REQUIRE_POSTGRES: 'true'
      VALYQON_CIS_PG16_CONTEXT: valyqon-cis-postgres16-ephemeral-ci-v1
      VALYQON_CIS_PG16_PASSWORD: only-for-disposable-github-cis16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile PostgreSQL fenced connector acceptance
        run: python -m compileall -q scripts/ci_cis_postgres16_fenced_acceptance.py
      - name: Verify PostgreSQL 16 migrations, fenced upsert, stale lease, snapshot and rollback
        timeout-minutes: 8
        run: python -B -m scripts.ci_cis_postgres16_fenced_acceptance

  cis-offline-compatibility:
    name: CIS worker and platform regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Exercise Russian, international and CIS worker contracts
        timeout-minutes: 10
        env:
          PYTHON_DOTENV_DISABLED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -B -m pytest -p no:cacheprovider -q
          tests/test_connector_workers.py
          tests/test_cis_am_tj_main_integration.py
          tests/test_international_sources.py
          tests/test_ru03_integration.py
