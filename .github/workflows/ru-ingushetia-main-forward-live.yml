name: RU Ingushetia main-first genuine Worker SQL and isolated delivery
on:
  pull_request:
    paths:
      - 'app/sources/**'
      - 'app/monitoring/**'
      - 'scripts/ci_ru_ingushetia_main_forward_live.py'
      - '.github/workflows/ru-ingushetia-main-forward-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  main-first-live:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Genuine first-party Ingushetia -> leased Worker -> disposable SQL -> user search and isolated ack
        timeout-minutes: 7
        run: python -B -m scripts.ci_ru_ingushetia_main_forward_live
