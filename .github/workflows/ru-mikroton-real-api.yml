name: RU MikroTon strict real public API acceptance

on:
  pull_request:
    paths:
      - "scripts/ci_ru_mikroton_real_api.py"
      - "tests/test_ru_mikroton_real_api.py"
      - "scripts/ci_ru_mikroton_authenticated.py"
      - "app/sources/mikroton_tender.py"
      - "app/monitoring/config.py"
      - "app/sources/catalog.py"
      - "app/sources/ingestion.py"
      - "tests/test_ru_mikroton_worker_contract.py"
      - "tests/test_mikroton_tender.py"
      - ".github/workflows/ru-mikroton-real-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ru-real-public-notice-and-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Offline strict shape and provenance tests
        run: python -m pytest -q tests/test_ru_mikroton_real_api.py tests/test_mikroton_tender.py tests/test_ru_mikroton_worker_contract.py
      - name: Strict live API notice and official detail identity
        timeout-minutes: 2
        run: python -B -m scripts.ci_ru_mikroton_real_api
      - name: Real live API notices through SQLite search and signed-in scoring
        timeout-minutes: 3
        run: python -B -m scripts.ci_ru_mikroton_authenticated
