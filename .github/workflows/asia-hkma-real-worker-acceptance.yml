name: Asia HKMA official Gazette tender worker acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/hk_hkma_tender.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - tests/test_hk_hkma_tender.py
      - scripts/asia_hkma_real_worker_acceptance.py
      - .github/workflows/asia-hkma-real-worker-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asia-hkma-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hkma-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_hk_hkma_tender.py tests/test_hk_hyd_tenders.py tests/test_jp_jetro_bid_rss.py tests/test_sg_gebiz_rss.py
  hkma-genuine-worker-search:
    runs-on: ubuntu-latest
    needs: [hkma-offline-contracts]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Real official Hong Kong tender API to worker SQLite and query
        env:
          VALYQON_ASIA_HKMA_ENABLED: '1'
        run: python -m scripts.asia_hkma_real_worker_acceptance
