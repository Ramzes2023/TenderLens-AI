name: RU-03 GPB verified public detail identity
on:
  push:
    branches: [ops/ru3-trusted-source-probe-20261016]
    paths: [.github/workflows/ru03-gpb-detail-identity.yml]
permissions: {}
jobs:
  gpb-detail:
    runs-on: valyqon-ru3
    timeout-minutes: 4
    steps:
      - name: Verify same-host public notice title and procedure numeric ID
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = VALYQON-ASIA-03
          python3 - <<'PY'
          import ssl,re,urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlsplit
          host='etpgpb.ru';base=f'https://{host}/procedures/'
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          client=urllib.request.build_opener(urllib.request.ProxyHandler({}),urllib.request.HTTPSHandler(context=ssl.create_default_context()),NR())
          class P(HTMLParser):
              def __init__(self):super().__init__();self.links=[];self.titles=[];self.active=False;self.parts=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='a' and a.get('href'):self.links.append(a['href'])
                  if t=='h1':self.active=True;self.parts=[]
              def handle_data(self,data):
                  if self.active:self.parts.append(data)
              def handle_endtag(self,t):
                  if t=='h1' and self.active:self.titles.append(' '.join(' '.join(self.parts).split()));self.active=False
          def fetch(url):
              u=urlsplit(url)
              if u.scheme!='https' or u.hostname!=host or u.port is not None or u.fragment or u.username:raise ValueError('Invalid host')
              with client.open(urllib.request.Request(url,headers={'Accept':'text/html'}),timeout=17) as response:
                  if response.status!=200 or 'html' not in response.headers.get('content-type','').lower():raise ValueError('Unexpected HTML response')
                  data=response.read(1_700_001)
              if len(data)>1_700_000 or not data:raise ValueError('Unexpected bytes')
              return data.decode('utf-8','replace')
          listing=P();listing.feed(fetch(base))
          links={}
          for raw in listing.links:
              u=urlsplit(urljoin(base,raw))
              m=re.fullmatch(r'/procedures/etp/([0-9]{5,10})-[a-z0-9-]+/',u.path)
              if m and u.scheme=='https' and u.hostname==host and not u.query and not u.fragment:links.setdefault(m.group(1),u.geturl())
          print('RU3_GPB_PUBLIC_NUMERIC_DETAIL_URLS='+str(len(links)))
          good=0
          for identity,url in list(links.items())[:3]:
              try:
                  body=fetch(url)
                  d=P();d.feed(body)
                  print(f'RU3_GPB_DETAIL_ID={identity};H1_TITLES={d.titles[:3]!r};IDENTITY_PRESENT={identity in body};BYTES={len(body.encode())}')
                  if d.titles and identity in body:good+=1
              except Exception as e:
                  print(f'RU3_GPB_DETAIL_ID={identity};FAILURE_CLASS={type(e).__name__}')
          print('RU3_GPB_VERIFIED_SAME_HOST_DETAILS='+str(good))
          print('PRODUCTION_CHANGED=NO')
          PY
