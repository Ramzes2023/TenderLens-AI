name: Asian public procurement acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "app/sources/asia_public.py"
      - "app/sources/catalog.py"
      - "app/sources/ingestion.py"
      - "tests/test_asia_public_sources.py"
      - "scripts/asia_six_live_acceptance.py"
      - ".github/workflows/asia-source-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asia-runner-readiness:
    # Dedicated diagnostic: do not run untrusted PR scripts or touch AWS.
    runs-on: [self-hosted, valyqon-ru]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Read-only runner readiness (no secrets)
        run: |
          python --version
          git --version
          python -c "import platform; print('VALYQON_RUNNER_OS=' + platform.system()); print('VALYQON_RUNNER_ARCH=' + platform.machine())"
      - name: Repository checkout availability
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm staged adapter files
        run: python -c "from pathlib import Path; assert all(Path(p).is_file() for p in ('app/sources/asia_public.py', 'scripts/asia_six_live_acceptance.py', 'tests/test_asia_public_sources.py')); print('ASIA_FILES_PRESENT=YES')"

  asia-six-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source, runner and regression contracts
        run: python -m compileall -q app/sources tests/test_asia_public_sources.py scripts/asia_six_live_acceptance.py
      - name: Test six official source contracts and existing orchestration
        run: python -m pytest -q tests/test_asia_public_sources.py tests/test_source_catalog.py tests/test_connector_workers.py tests/test_source_http.py tests/test_source_http_transport.py
  asia-six-real-live-sqlite:
    runs-on: ubuntu-latest
    needs: [asia-six-offline-contracts]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Real six-feed ingestion to ephemeral SQLite and keyword query
        env:
          VALYQON_ASIA_SOURCES_ENABLED: "1"
        run: python -m scripts.asia_six_live_acceptance
