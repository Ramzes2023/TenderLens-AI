name: RU STAN first-party commercial procurement live SQL and tenant acceptance
on:
  push:
    branches: [feat/ru-stan-commercial-leased-20261017]
    paths:
      - app/sources/stan_commercial_public.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/monitoring/config.py
      - app/scoring/runs.py
      - scripts/ci_ru_stan_real_worker.py
      - scripts/ci_ru_stan_authenticated.py
      - tests/test_ru_stan_commercial_adapter.py
      - .github/workflows/ru-stan-commercial-acceptance.yml
  pull_request:
    branches: [main, research/ru-stan-commercial-20261017]
permissions:
  contents: read
jobs:
  stan-strict-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject foreign syndicated cards, unsafe Punycode URLs and inconsistent detail IDs
        run: python -m pytest -q tests/test_ru_stan_commercial_adapter.py
  stan-live-fenced-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Real STAN native notices into durable lease, SQLite and keyword lookup
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_stan_real_worker
  stan-live-auth-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Real STAN native notices through authenticated scoring with tenant isolation
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_stan_authenticated
