name: RU pinned Fabrikant44 official live source to leased SQL and query
on:
  push:
    branches: [diag/ru-final-gates-20261016]
    paths: [.github/workflows/ru-final-fabrikant44-live.yml]
permissions:
  contents: read
jobs:
  official-live-fabrikant44:
    runs-on: valyqon-ru3
    timeout-minutes: 14
    steps:
      - name: Trusted isolated runner only
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = VALYQON-ASIA-03
          test "$(id -un)" = valyqon
          ! mountpoint -q /mnt/c
      - uses: actions/checkout@v4
        with:
          ref: ef9938c605010afd92cb52e78b05ef7fe54f9a07
          persist-credentials: false
      - name: Exact vetted source SHA offline contracts and live durable worker to search
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ef9938c605010afd92cb52e78b05ef7fe54f9a07
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          python3 -m venv "$d/venv"
          "$d/venv/bin/python" -m pip install --disable-pip-version-check -r requirements-dev.txt >/dev/null
          "$d/venv/bin/python" -m pytest -q tests/test_ru_fabrikant44_public.py
          "$d/venv/bin/python" -B -m scripts.ci_ru_fabrikant44_real_worker
          "$d/venv/bin/python" -B -m scripts.ci_ru_fabrikant44_authenticated
          echo 'RU_FABRIKANT44_INDEPENDENT_SOURCE_SQL_KEYWORD=PASS'
          echo 'PRODUCTION_CHANGED=NO'
