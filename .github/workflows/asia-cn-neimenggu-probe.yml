name: China Inner Mongolia official government procurement public discovery
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/asia_cn_neimenggu_probe.py
      - .github/workflows/asia-cn-neimenggu-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-public-china-border-procurement-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: python -m scripts.asia_cn_neimenggu_probe
