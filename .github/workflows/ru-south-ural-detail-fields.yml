name: RU South Ural first-party procurement customer price deadline proof
on:
  push:
    branches: [feat/ru-south-ural-official-fields-20261017]
    paths:
      - app/sources/south_ural_public.py
      - tests/test_ru_south_ural_adapter.py
      - .github/workflows/ru-south-ural-detail-fields.yml
  pull_request:
    branches: [main, feat/ru-south-ural-depth-10-20261017]
permissions:
  contents: read
jobs:
  original-fields-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject forged price and dates, validate source's optional legal procurement metadata
        run: python -m pytest -q tests/test_ru_south_ural_adapter.py
  original-fields-live-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Actual published first-party details with optional values through fenced SQL and keyword search
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_south_ural_real_worker
  original-fields-live-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Live original metadata in authenticated tenant-scoped scoring
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_south_ural_authenticated
