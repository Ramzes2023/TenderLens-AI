name: Türkiye Ankara municipality real government tenders acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/tr_ankara_municipality.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - tests/test_tr_ankara_municipality.py
      - scripts/asia_tr_ankara_real_worker.py
      - .github/workflows/asia-tr-ankara-real-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: turkey-ankara-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tr-ankara-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_tr_ankara_municipality.py tests/test_uae_mof_rfqs.py tests/test_india_epublish.py
  tr-ankara-live-worker-sqlite-search:
    runs-on: ubuntu-latest
    needs: [tr-ankara-offline-contracts]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Real Ankara procurement official 4 detail GETs → worker → SQLite → keyword search
        env:
          VALYQON_ASIA_TURKEY_ANKARA_ENABLED: '1'
        run: python -m scripts.asia_tr_ankara_real_worker
