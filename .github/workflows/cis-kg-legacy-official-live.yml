name: CIS Kyrgyz legacy official tender listing discovery

on:
  push:
    branches:
      - integration/cis-kg-legacy-official-list-20261016
    paths:
      - app/sources/kg_gov_legacy.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - scripts/ci_cis_kg_legacy_live_acceptance.py
      - tests/test_cis_kg_gov_legacy.py
      - scripts/ci_cis_kg_legacy_structure.py
      - .github/workflows/cis-kg-legacy-official-live.yml
  pull_request:
    paths:
      - app/sources/kg_gov_legacy.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - scripts/ci_cis_kg_legacy_live_acceptance.py
      - tests/test_cis_kg_gov_legacy.py
      - scripts/ci_cis_kg_legacy_structure.py
      - .github/workflows/cis-kg-legacy-official-live.yml

permissions:
  contents: read

jobs:
  official-kg-live-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify real TLS HTML listing from official Kyrgyz portal, no mocks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B scripts/ci_cis_kg_legacy_structure.py

  kg-strict-offline-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser and application dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reject incomplete / malicious notices offline
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p test_cis_kg_gov_legacy.py -v

  kg-official-worker-search-live:
    needs: [official-kg-live-listing, kg-strict-offline-adapter]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable acceptance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Real Kyrgyz official HTTPS -> fenced job -> disposable SQLite -> searchable snapshot
        timeout-minutes: 4
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHON_DOTENV_DISABLED: '1'
        run: python -B -m scripts.ci_cis_kg_legacy_live_acceptance --source kg_gov_legacy
