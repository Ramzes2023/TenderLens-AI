name: RU genuine leased worker acceptance contracts
on:
  push:
    branches: [fix/ru-acceptance-genuine-leases-20261016]
    paths:
      - scripts/ci_ru_leased_connector.py
      - scripts/ci_ru_b2b_real_worker.py
      - scripts/ci_ru_mikroton_real_worker.py
      - scripts/ci_ru_tektorg_real_worker.py
      - scripts/ci_ru_eis44_html_worker.py
      - tests/test_ru_live_worker_fenced_gates.py
      - .github/workflows/ru-live-worker-fenced-gates.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/ci_ru_leased_connector.py
      - scripts/ci_ru_b2b_real_worker.py
      - scripts/ci_ru_mikroton_real_worker.py
      - scripts/ci_ru_tektorg_real_worker.py
      - scripts/ci_ru_eis44_html_worker.py
      - tests/test_ru_live_worker_fenced_gates.py
      - .github/workflows/ru-live-worker-fenced-gates.yml
permissions:
  contents: read
jobs:
  real-worker-fence-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject unfenced connector acceptance and incorrect source configuration
        run: python -m pytest -q tests/test_ru_live_worker_fenced_gates.py
      - name: Compile four real worker acceptance entrypoints
        run: python -m py_compile scripts/ci_ru_b2b_real_worker.py scripts/ci_ru_mikroton_real_worker.py scripts/ci_ru_tektorg_real_worker.py scripts/ci_ru_eis44_html_worker.py
