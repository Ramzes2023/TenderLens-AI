name: Turkish Ankara ASKİ EGO public procurement proof
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/asia_tr_aski_ego_probe.py
      - .github/workflows/asia-tr-aski-ego-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-genuine-public-tenders:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: python -m scripts.asia_tr_aski_ego_probe
