name: RU-03 EIS 44-FZ real procurement block structure

on:
  push:
    branches: [ops/ru3-trusted-source-probe-20261016]
    paths: [.github/workflows/ru03-eis44-block-structure.yml]

permissions: {}

jobs:
  eis44-eis223:
    runs-on: valyqon-ru3
    timeout-minutes: 5
    steps:
      - name: Verify official Ministry chain and live EIS feeds with TLS fully enabled
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = VALYQON-ASIA-03
          test "$(id -un)" = valyqon
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          for part in root sub; do
            if test "$part" = root; then
              file=russian_trusted_root_ca
              expected=d26d2d0231b7c39f92cc738512ba54103519e4405d68b5bd703e9788ca8ecf31
            else
              file=russian_trusted_sub_ca
              expected=bbbde2103e790b999ec62bd03cf625a5a2e7c316e10afe6a490eedead8b3fd9b
            fi
            curl --noproxy '*' --fail --silent --show-error --proto '=https' --max-redirs 0 --connect-timeout 8 --max-time 20 --max-filesize 65536 \
              "https://gu-st.ru/content/Other/doc/$file.cer" -o "$dir/$file.cer"
            if ! openssl x509 -inform PEM -in "$dir/$file.cer" -out "$dir/$part.pem" 2>/dev/null; then
              openssl x509 -inform DER -in "$dir/$file.cer" -out "$dir/$part.pem"
            fi
            thumb="$(openssl x509 -in "$dir/$part.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test "$thumb" = "$expected"
            echo "RU3_EIS_CA_${part}_SHA256=PASS"
          done
          openssl verify -CAfile "$dir/root.pem" "$dir/sub.pem"
          cat "$dir/root.pem" "$dir/sub.pem" > "$dir/eis-only.pem"
          curl --noproxy '*' --fail --silent --show-error --proto '=https' --cacert "$dir/eis-only.pem" --max-redirs 0 \
            --connect-timeout 8 --max-time 25 --max-filesize 1200000 \
            --output "$dir/44.html" "https://zakupki.gov.ru/epz/order/extendedsearch/results.html?fz44=on&pageNumber=1"
          python3 - "$dir/44.html" <<'PY'
          import sys,re
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlsplit,parse_qs

          class Cards(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.depth=0; self.card=None;self.cards=[];self.active=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if self.card is None and tag == 'div' and 'search-registry-entry-block' in a.get('class','').split():
                      self.card={'text':[], 'links':[], 'classes':{}};self.depth=1
                      return
                  if self.card is not None:
                      if tag == 'div':self.depth+=1
                      if 'class' in a:
                          for cls in a['class'].split():
                              if cls not in self.card['classes']:
                                  self.card['classes'][cls]=0
                              self.card['classes'][cls]+=1
                      if tag=='a' and a.get('href'):
                          self.card['links'].append([a['href'], ''])
                  if self.card is not None and tag=='a':
                      self.active=True
              def handle_data(self,data):
                  if self.card is not None:
                      self.card['text'].append(data)
                      if self.active and self.card['links']:
                          self.card['links'][-1][1]+=data
              def handle_endtag(self,tag):
                  if self.card is None:return
                  if tag == 'a':self.active=False
                  if tag=='div':
                      self.depth-=1
                      if self.depth==0:
                          self.cards.append(self.card);self.card=None;self.active=False

          raw=open(sys.argv[1],'rb').read()
          parser=Cards();parser.feed(raw.decode('utf-8','replace'))
          print('RU3_EIS_44_CARD_COUNT='+str(len(parser.cards)))
          for i,c in enumerate(parser.cards[:3]):
              text=' '.join(' '.join(c['text']).split())
              links=[]
              for href,title in c['links']:
                  u=urlsplit(urljoin('https://zakupki.gov.ru/',href))
                  if u.hostname!='zakupki.gov.ru' or u.scheme!='https':continue
                  if re.search('/epz/order/notice/',u.path):
                      links.append((u.path, sorted(parse_qs(u.query)), ' '.join(title.split())[:95]))
              print('RU3_EIS_44_CARD_'+str(i)+'_TEXT_PREVIEW='+repr(text[:750]))
              print('RU3_EIS_44_CARD_'+str(i)+'_NOTICE_URL_SHAPES='+repr(links[:6]))
              print('RU3_EIS_44_CARD_'+str(i)+'_CLASS_NAMES='+repr(sorted(c['classes'])[:40]))
          print('RU3_EIS_44_REAL_DETAIL_NOT_VERIFIED=YES')
          PY
          echo 'EIS_REAL_TENDER_RECORDS_VERIFIED=NO'
          echo "RU3_CA_SCOPE=EIS_ONLY"
          echo "TLS_VERIFICATION_DISABLED=NO"
          echo "PRODUCTION_CHANGED=NO"
