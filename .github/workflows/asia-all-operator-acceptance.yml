name: Asia all fourteen verified adapters operator queue acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "app/sources/asia_all.py"
      - "app/sources/sg_gebiz_rss.py"
      - "app/sources/asia_public.py"
      - "app/sources/hk_hyd_tenders.py"
      - "app/sources/jp_jetro_bid_rss.py"
      - "app/sources/hk_hkma_tender.py"
      - "app/sources/india_epublish.py"
      - "app/sources/uae_mof_rfqs.py"
      - "app/sources/tr_ankara_municipality.py"
      - "tests/test_asia_all.py"
      - "tests/test_india_epublish.py"
      - "tests/test_uae_mof_rfqs.py"
      - "tests/test_tr_ankara_municipality.py"
      - "tests/test_hk_hkma_tender.py"
      - ".github/workflows/asia-all-operator-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asia-all-operator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  all-fourteen-queue-db-search-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Fourteen approved sources → actual Worker lease fencing → SQLite → keyword search
        run: python -m pytest -q tests/test_asia_all.py tests/test_asia_seven_operations.py tests/test_sg_gebiz_rss.py tests/test_jp_jetro_bid_rss.py tests/test_hk_hyd_tenders.py tests/test_hk_hkma_tender.py tests/test_india_epublish.py tests/test_uae_mof_rfqs.py tests/test_tr_ankara_municipality.py
