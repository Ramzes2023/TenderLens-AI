name: Asia Singapore GeBIZ business-opportunity RSS acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "app/sources/sg_gebiz_rss.py"
      - "app/sources/catalog.py"
      - "app/sources/ingestion.py"
      - "tests/test_sg_gebiz_rss.py"
      - "scripts/asia_sg_gebiz_real_worker_acceptance.py"
      - ".github/workflows/asia-sg-gebiz-live-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asia-gebiz-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sg-gebiz-offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_sg_gebiz_rss.py tests/test_hk_hyd_tenders.py tests/test_jp_jetro_bid_rss.py tests/test_asia_public_sources.py tests/test_connector_workers.py
  sg-gebiz-real-queue-db-query:
    runs-on: ubuntu-latest
    needs: [sg-gebiz-offline-regressions]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Official 2 category RSS → real Worker → temporary DB → keyword search
        env:
          VALYQON_ASIA_GEBIZ_ENABLED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.asia_sg_gebiz_real_worker_acceptance
