name: VALYQON live public source route audit (read only)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/probe_public_source_routes.py
      - app/sources/isolated_public_inventory.py
      - tests/test_isolated_public_source_inventory.py
      - .github/workflows/public-source-live-route-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-live-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate safe public-only response parser offline
        run: |
          python -m py_compile scripts/probe_public_source_routes.py
          python -B scripts/probe_public_source_routes.py --self-test
      - name: Verify isolated per-source inventory is safe and read-only
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_isolated_public_source_inventory.py
      - name: Verify actual public HTTPS saved-source routes (not source activation)
        timeout-minutes: 2
        run: python -B scripts/probe_public_source_routes.py --live
