name: Russian real-data user scoring acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci_ru_b2b_user_scoring.py"
      - "scripts/ci_ru_b2b_real_worker.py"
      - "scripts/diagnose_ru_b2b_transport.py"
      - "tests/test_b2b_transport_acceptance.py"
      - "tests/test_b2b_foreign_aggregate.py"
      - ".github/workflows/ru-real-data-acceptance.yml"
      - "app/sources/b2b_center.py"
      - "app/sources/http.py"
      - "app/sources/http_transport.py"
      - "app/sources/ingestion.py"
      - "app/sources/snapshots.py"
      - "app/scoring/**"
      - "app/api/organization_workflow_routes.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-b2b-authenticated-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile isolated authenticated live acceptance
        run: python -m compileall -q scripts/ci_ru_b2b_user_scoring.py
      - name: Strict B2B transport, durable retry, provenance and authorization regressions
        run: python -B -m pytest -q tests/test_b2b_transport_acceptance.py tests/test_b2b_foreign_aggregate.py tests/test_ru_b2b_worker_fallback_budget.py
      - name: Real public B2B notice to ephemeral SQLite to signed-in scoring and tenant isolation
        timeout-minutes: 3
        run: python -B scripts/ci_ru_b2b_user_scoring.py
      - name: Diagnose official root and office with unchanged strict transport after failure
        if: failure()
        timeout-minutes: 2
        run: python -B -m scripts.diagnose_ru_b2b_transport
