name: RU South Ural Optional Public-Site Source Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/isolated_public_scheduler.py
      - ops/public_sources/compose.south-ural.yaml
      - scripts/verify_south_ural_public_site_candidate.py
      - scripts/ci_ru_south_ural_current_open.py
      - tests/test_south_ural_public_site_candidate.py
      - .github/workflows/ru-south-ural-public-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-third-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEGRAM_BOT_TOKEN: ''
      OUTBOUND_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify source identity, expiry and optional overlay offline
        run: python -m pytest -q tests/test_south_ural_public_site_candidate.py tests/test_isolated_public_source_scheduler.py
      - name: Verify merged Docker Compose keeps all production services and data unchanged
        run: |
          docker compose --profile operator --profile verified-scheduler \
            -p valyqon-public-sources \
            -f ops/public_sources/compose.yaml \
            -f ops/public_sources/compose.south-ural.yaml \
            config --format json > /tmp/merged-public-sources.json
          python - <<'PY'
          import json
          conf=json.load(open('/tmp/merged-public-sources.json'))
          services=conf['services']
          assert set(services)=={'guest-sources','worker','scheduler','enqueue'}
          for name,svc in services.items():
              assert svc.get('environment',{}).get('SOUTH_URAL_PUBLIC_ENABLED')=='true',name
              assert svc['environment']['DATABASE_URL']=='sqlite:////app/data/isolated-public-sources.sqlite3'
              assert svc.get('read_only') is True
              assert not svc.get('ports')
              assert all(v.get('type')=='volume' for v in svc.get('volumes',[]))
          assert services['scheduler']['network_mode']=='none'
          assert services['enqueue']['network_mode']=='none'
          assert all(not v.get('external') for v in conf['volumes'].values())
          print('SOUTH_URAL_OPTIN_COMPOSE_ISOLATION=PASS')
          PY

  original-worker-guest-open:
    runs-on: ubuntu-latest
    needs: isolated-third-source
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEGRAM_BOT_TOKEN: ''
      OUTBOUND_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Real original → fenced Worker → independent disposable SQL → query
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_south_ural_10_real_worker
      - name: Current live original submission deadline, not historical pass
        timeout-minutes: 5
        run: python -B -m scripts.ci_ru_south_ural_current_open
