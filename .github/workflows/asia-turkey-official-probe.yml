name: Türkiye official public tenders anonymous discovery
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/asia_turkey_official_probe.py
      - .github/workflows/asia-turkey-official-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tr-public-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  live-public-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: python -m scripts.asia_turkey_official_probe
