name: RU Ingushetia official EIS RSS pinned-CA diagnosis

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_ingushetia_eis_rss_failure.py
      - tests/test_research_ru_ingushetia_eis_rss_failure.py
      - .github/workflows/ru-ingushetia-eis-rss-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-official-rss-diagnosis-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEGRAM_BOT_TOKEN: ''
      OUTBOUND_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Offline negative tests, no false source delivery
        run: python -m pytest -q tests/test_research_ru_ingushetia_eis_rss_failure.py
      - name: Genuine official Ingushetia 44-FZ RSS strict pinned-CA GET
        timeout-minutes: 4
        run: python -B -m scripts.research_ru_ingushetia_eis_rss_failure
      - name: Diagnostic cannot authorize regional activation
        run: |
          echo "RU_INGUSHETIA_WORKER_SQL_VERIFIED=NO"
          echo "PRODUCTION_CHANGED=NO"
          echo "FIVE_WORKING_SOURCES_PRESERVED=YES"
