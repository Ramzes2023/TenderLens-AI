name: RU TEK-Torg genuine exact-visible original detail -> fenced Worker SQL
on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/tektorg_public_html.py
      - tests/test_ru_tektorg_public.py
      - scripts/ci_ru_tektorg_fenced_acceptance.py
permissions:
  contents: read
jobs:
  tektorg-hidden-id-offline-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject injected, hidden and partial procurement identity
        run: python -m pytest -q tests/test_ru_tektorg_public.py

  tektorg-firstparty-details-to-leased-worker-sql:
    runs-on: windows-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require current native list + exact visible original details through real Worker to SQL and user search
        timeout-minutes: 7
        run: python -B -m scripts.ci_ru_tektorg_fenced_acceptance
