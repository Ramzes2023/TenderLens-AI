        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Real independently corroborated NMCK purchases -> fenced SQL -> keyword lookup
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_nmck_real_worker
      - name: Real NMCK purchases -> authorized tenant scoring and denial
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_nmck_authenticated
  stan-commercial-public-signal:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Native STAN commercial (non-EIS-mirror) -> fenced SQL -> keyword lookup
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_stan_real_worker
      - name: Native STAN notices -> authorized tenant scoring and denial
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_stan_authenticated

  south-ural-ten-public-signal:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
