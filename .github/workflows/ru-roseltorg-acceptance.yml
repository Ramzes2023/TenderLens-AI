name: RU Roseltorg public source acceptance
on:
  push:
    branches: [feat/ru-roseltorg-live-full-20261017]
    paths:
      - app/sources/roseltorg_public.py
      - tests/test_ru_roseltorg_public.py
      - scripts/ci_ru_roseltorg_real_worker.py
      - scripts/ci_ru_roseltorg_authenticated.py
      - .github/workflows/ru-roseltorg-acceptance.yml
  pull_request:
    branches: [main]
    paths:
      - app/sources/roseltorg_public.py
      - tests/test_ru_roseltorg_public.py
      - scripts/ci_ru_roseltorg_real_worker.py
      - scripts/ci_ru_roseltorg_authenticated.py
      - .github/workflows/ru-roseltorg-acceptance.yml
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/scoring/runs.py
      - app/monitoring/config.py
permissions:
  contents: read
jobs:
  roseltorg-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reject unsafe URLs, identity mismatches and synthetic unverified cards
        run: python -m pytest -q tests/test_ru_roseltorg_public.py

  roseltorg-live-fenced-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tested dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Independently verified real Roseltorg detail to leased worker SQLite and search
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_roseltorg_real_worker

  roseltorg-real-public-transport-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Observe bounded numeric HTTP status
        run: python -m scripts.ru_marketplace_transport_observation roseltorg_public
      - name: Verify official listing and independently checked detail, report only bounded failure classes
        timeout-minutes: 3
        run: python -B -m scripts.ci_ru_roseltorg_safe_probe

  roseltorg-live-auth-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Real original notices to authenticated scoring and tenant isolation
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_roseltorg_authenticated
