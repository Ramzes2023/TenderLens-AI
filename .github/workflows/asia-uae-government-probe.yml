name: Asia UAE federal Ministry of Finance public tenders probe
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/asia_uae_mof_live_probe.py
      - .github/workflows/asia-uae-government-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asia-uae-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  uae-official-public-structural-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: python -m scripts.asia_uae_mof_live_probe
