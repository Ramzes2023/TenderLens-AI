name: RU Fabrikant soap4 official original host hypothesis

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_fabrikant_soap4_original_host.py
      - scripts/research_ru_chechnya_soap4_firstparty_details.py
      - tests/test_research_ru_chechnya_soap4_firstparty_details.py
      - tests/test_research_ru_fabrikant_soap4_original_host.py
      - .github/workflows/ru-fabrikant-soap4-original-host.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-official-original-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEGRAM_BOT_TOKEN: ''
      OUTBOUND_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify exact original and hypothesis cannot bypass real firstparty HTML
        run: python -m pytest -q tests/test_research_ru_fabrikant_soap4_original_host.py tests/test_research_ru_chechnya_soap4_firstparty_details.py
      - name: Strict official historical control and current Ingushetia detail GET
        timeout-minutes: 4
        run: python -B -m scripts.research_ru_fabrikant_soap4_original_host
      - name: Two current Chechnya publisher detail hypotheses, never source discovery
        timeout-minutes: 4
        run: python -B -m scripts.research_ru_chechnya_soap4_firstparty_details
      - name: Never mark regional source as verified from individual HTML only
        run: |
          echo "SOURCE_LIST_DISCOVERY=NOT_PROVED"
          echo "WORKER_SQL_SEARCH=NOT_PROVED"
          echo "FIFTH_SOURCE_STACK_UNCHANGED=YES"
