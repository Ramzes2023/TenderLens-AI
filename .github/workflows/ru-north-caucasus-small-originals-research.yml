name: RU North Caucasus real original small-purchase research

on:
  push:
    branches: [research/ru-north-caucasus-original-small-20261018]
    paths:
      - scripts/research_ru_north_caucasus_small.py
      - tests/test_ru_north_caucasus_small.py
      - docs/sources/ru_north_caucasus_small_research.md
      - .github/workflows/ru-north-caucasus-small-originals-research.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_north_caucasus_small.py
      - tests/test_ru_north_caucasus_small.py
      - docs/sources/ru_north_caucasus_small_research.md
      - .github/workflows/ru-north-caucasus-small-originals-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-identity-offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reject malicious links and fake tender details
        run: python -m pytest -q tests/test_ru_north_caucasus_small.py

  independent-regional-originals-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region: [north_ossetia, kbr, nalchik, kchr, dagestan_vitrine]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Real independent original notices only; fail on JS-only shell, redirects or missing details
        timeout-minutes: 5
        run: python -B -m scripts.research_ru_north_caucasus_small --region "${{ matrix.region }}"

  fixed-host-readonly-connectivity-diagnostic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region: [north_ossetia, kbr, nalchik, kchr, dagestan_vitrine]
    steps:
      - name: Classify public DNS, direct HTTPS and HTTP status without credentials or redirect
        shell: bash
        env:
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          case "$REGION" in
            north_ossetia) host='15.portalregion.ru' ;;
            kbr) host='kbr.sberb2b.ru' ;;
            nalchik) host='nalchik.sberb2b.ru' ;;
            kchr) host='kchr.sberb2b.ru' ;;
            dagestan_vitrine) host='dagestan.sberb2b.ru' ;;
            *) exit 2 ;;
          esac
          if getent ahostsv4 "$host" >/dev/null; then
            echo "RU_NC_DNS=RESOLVED"
          else
            echo "RU_NC_DNS=UNRESOLVED"
          fi
          # One first-party public GET only. Do not accept redirects or TLS downgrade.
          result="$(curl --noproxy '*' --silent --show-error --proto '=https' \
            --retry 0 --max-redirs 0 --connect-timeout 8 --max-time 22 \
            --output /dev/null --write-out '%{http_code}' "https://$host/")" && rc=0 || rc=$?
          echo "RU_NC_REGION=$REGION"
          echo "RU_NC_HTTP_STATUS=$result"
          echo "RU_NC_CURL_EXIT=$rc"
          echo "DIAGNOSTIC_ONLY=YES"
          echo "ORIGINAL_TENDER_VERIFIED=NO"
          echo "PRODUCTION_CHANGED=NO"

  north-ossetia-redirect-target-diagnostic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read but never follow public 307 target, disclose no tokens or cookies
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          code="$(curl --noproxy '*' --silent --show-error --proto '=https' \
            --retry 0 --max-redirs 0 --connect-timeout 8 --max-time 20 \
            --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
            'https://15.portalregion.ru/')" && rc=0 || rc=$?
          echo "RU_NC_OSSETIA_HTTP=$code"
          echo "RU_NC_OSSETIA_CURL_EXIT=$rc"
          python - "$headers" <<'PY'
          import pathlib, sys
          from urllib.parse import urljoin, urlsplit
          raw = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          redirects = [
              line.split(":", 1)[1].strip()
              for line in raw.splitlines()
              if line.lower().startswith("location:")
          ]
          if len(redirects) != 1:
              print("RU_NC_REDIRECT_KIND=NONE_OR_AMBIGUOUS")
          else:
              u = urlsplit(urljoin("https://15.portalregion.ru/", redirects[0]))
              if (u.scheme == "https" and u.hostname == "15.portalregion.ru"
                      and not u.username and not u.password and u.port is None
                      and not any(c in u.path for c in "\r\n")):
                  print("RU_NC_REDIRECT_KIND=SAME_HOST_HTTPS")
                  print("RU_NC_REDIRECT_PUBLIC_PATH=" + u.path[:140])
                  print("RU_NC_REDIRECT_HAS_QUERY=" + str(bool(u.query)))
              else:
                  print("RU_NC_REDIRECT_KIND=EXTERNAL_OR_UNSAFE")
          PY
          echo "DIAGNOSTIC_ONLY=YES"
          echo "ORIGINAL_TENDER_VERIFIED=NO"
