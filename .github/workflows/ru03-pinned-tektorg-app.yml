name: RU-03 pinned TEK-Torg 223-FZ real worker acceptance

on:
  push:
    branches: [ops/ru3-trusted-source-probe-20261016]
    paths: [.github/workflows/ru03-pinned-tektorg-app.yml]

permissions:
  contents: read

jobs:
  tektorg-real-worker:
    runs-on: valyqon-ru3
    timeout-minutes: 17
    steps:
      - name: Verify isolated dedicated Russian runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = VALYQON-ASIA-03
          test "$(id -un)" = valyqon
          if mountpoint -q /mnt/c; then exit 1; fi
      - name: Checkout reviewed immutable Russian TEK-Torg integration candidate
        uses: actions/checkout@v4
        with:
          ref: c518a2761c7f6c180cf4fa8f9bfcf2294bee4e64
          persist-credentials: false
      - name: Offline contract tests and real public source durable-worker proof
        shell: bash
        env:
          MONITORING_ENABLED: "false"
          VALYQON_EMAIL_MODE: disabled
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c518a2761c7f6c180cf4fa8f9bfcf2294bee4e64
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          python3 -m venv "$temp/venv"
          "$temp/venv/bin/python" -m pip install --disable-pip-version-check -r requirements-dev.txt >/dev/null
          "$temp/venv/bin/python" -m pytest -q tests/test_ru_tektorg_public.py
          "$temp/venv/bin/python" -B -m scripts.ci_ru_tektorg_real_worker
          echo 'RU3_TEKTORG_REAL_APP=PASS'
          echo 'PRODUCTION_CHANGED=NO'
