name: CIS Uzbekistan official UzEx tender acceptance

on:
  push:
    branches:
      - research/cis-uz-uzex-official-live-gate-20261016
    paths:
      - app/sources/uz_uzex.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - scripts/ci_cis_uzex_live_acceptance.py
      - tests/test_cis_uzex_adapter.py
      - scripts/cis_uzex_official_probe.py
      - tests/test_cis_uzex_official_probe.py
      - .github/workflows/cis-uz-uzex-official-live.yml
  pull_request:
    paths:
      - app/sources/uz_uzex.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - scripts/ci_cis_uzex_live_acceptance.py
      - tests/test_cis_uzex_adapter.py
      - scripts/cis_uzex_official_probe.py
      - tests/test_cis_uzex_official_probe.py
      - .github/workflows/cis-uz-uzex-official-live.yml

permissions:
  contents: read

jobs:
  offline-probe-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install adapter test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prove parser rejects incomplete or fake notices
        run: python -B -m unittest discover -s tests -p test_cis_uzex_official_probe.py -v
      - name: Strict Uzbekistan adapter normalization tests
        run: python -B -m unittest discover -s tests -p test_cis_uzex_adapter.py -v

  official-live-tradelist:
    needs: offline-probe-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real official HTTPS POST for both tenders and selections, fail closed
        run: python -B scripts/cis_uzex_official_probe.py --require-live

  official-live-worker-sqlite:
    needs: official-live-tradelist
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated acceptance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Real UzEx HTTPS -> leased worker -> disposable SQLite -> saved search
        timeout-minutes: 4
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHON_DOTENV_DISABLED: '1'
        run: python -B -m scripts.ci_cis_uzex_live_acceptance --source uz_uzex
