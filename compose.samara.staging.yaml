# Standalone staging project. Never combine with production compose overrides.
name: valyqon-samara-stage

x-runtime: &runtime
  build: .
  image: tenderlens-ai:samara-stage
  restart: "no"
  env_file:
    - "${SAMARA_STAGING_ENV_FILE:?Set a dedicated staging env file, never production .env}"
  environment: &environment
    DATABASE_URL: sqlite:////app/data/samara-stage.db
    DATA_DIR: /app/data
    RU_SAMARA_PUBLIC_LIST_ENABLED: "true"
    VALYQON_CONNECTOR_MAX_RECORDS: "30"
    VALYQON_RU_BACKGROUND_CATALOG_ENABLED: "true"
    EIS_PROFILE_FEEDS_ENABLED: "false"
    EIS_RSS_URLS: ""
  volumes:
    - samara_staging_data:/app/data
  stop_grace_period: 60s

services:
  api:
    <<: *runtime
    ports:
      - "127.0.0.1:18080:8000"
  worker:
    <<: *runtime
    command: ["python", "-m", "app.jobs.worker", "--connectors"]
    # The image's HTTP healthcheck is for the API, not this process.
    healthcheck:
      disable: true
  bot:
    <<: *runtime
    profiles: [telegram-test]
    command: ["python", "-m", "app.bot"]
    environment:
      <<: *environment
      RAG_QDRANT_PATH: /app/data/qdrant-bot
    healthcheck:
      disable: true

volumes:
  samara_staging_data:
