name: RU Dagestan staged genuine public listings only

on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/ru_dagestan_public_list.py
      - tests/test_ru_dagestan_public_list.py
      - scripts/ci_ru_dagestan_public_list_sql.py
      - .github/workflows/ru-dagestan-public-list-sql.yml
      - app/sources/ingestion.py

permissions:
  contents: read

concurrency:
  group: ru-dag-list-sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-strict-public-list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject forged listings and verify source remains absent from production catalog
        run: python -m pytest -q tests/test_ru_dagestan_public_list.py

  live-sql-and-keyword-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Live native official list to disposable leased worker SQLite and exact keyword search
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_dagestan_public_list_sql
