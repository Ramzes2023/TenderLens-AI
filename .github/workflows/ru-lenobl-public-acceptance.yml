name: RU Lenobl independent public small procurement acceptance
on:
  push:
    branches: [feat/ru-lenobl-public-small-20261016]
    paths:
      - app/sources/lenobl_small_public.py
      - tests/test_ru_lenobl_small_public.py
      - scripts/ci_ru_lenobl_real_worker.py
      - scripts/ci_ru_lenobl_authenticated.py
      - .github/workflows/ru-lenobl-public-acceptance.yml
  pull_request:
    branches: [main]
    paths:
      - app/sources/lenobl_small_public.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/monitoring/config.py
      - app/scoring/runs.py
      - tests/test_ru_lenobl_small_public.py
      - scripts/ci_ru_lenobl_real_worker.py
      - scripts/ci_ru_lenobl_authenticated.py
      - .github/workflows/ru-lenobl-public-acceptance.yml
permissions:
  contents: read
jobs:
  lenobl-strict-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Strict portal listing and independent verified details
        run: python -m pytest -q tests/test_ru_lenobl_small_public.py
      - name: Compile genuine worker and signed-in user search proofs
        run: python -m py_compile scripts/ci_ru_lenobl_real_worker.py scripts/ci_ru_lenobl_authenticated.py
  lenobl-live-durable-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Real public region notice to leased worker and isolated searchable SQL
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_lenobl_real_worker
  lenobl-live-auth-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Real region public notices to signed-in customer scoring and tenant isolation
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_lenobl_authenticated
