name: Asia China India Mongolia official public tender live research
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/asia_china_india_mongolia_probe.py
      - .github/workflows/asia-russia-neighbor-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asia-russia-neighbors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  live-anonymous-portal-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: python -m scripts.asia_china_india_mongolia_probe
