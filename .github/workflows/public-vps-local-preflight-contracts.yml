name: VALYQON public preflight safety (local-only)
on:
  pull_request:
    paths:
      - scripts/valyqon_vps_readonly_preflight.py
      - scripts/valyqon_vps_short_ssh_inventory.py
      - scripts/valyqon_local_compose_preflight.py
      - tests/test_valyqon_vps_readonly_preflight.py
      - tests/test_valyqon_vps_short_ssh_inventory.py
      - tests/test_valyqon_vps_remote_shell_contract.py
      - tests/test_valyqon_local_compose_preflight.py
      - scripts/verify_public_https.py
      - scripts/valyqon_static_sqlite_premium_gate.py
      - tests/test_valyqon_static_sqlite_premium_gate.py
      - tests/test_verify_public_https.py
      - .github/workflows/public-vps-local-preflight-contracts.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-local-release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Validate redacted SSH preflight and no private file export
        run: python -m pytest -q tests/test_valyqon_vps_readonly_preflight.py tests/test_valyqon_vps_short_ssh_inventory.py tests/test_valyqon_vps_remote_shell_contract.py tests/test_valyqon_local_compose_preflight.py tests/test_verify_public_https.py
      - name: Validate SQLite-preserving public landing source only (not production)
        run: |
          python -m pytest -q tests/test_valyqon_static_sqlite_premium_gate.py
          python -m scripts.valyqon_static_sqlite_premium_gate
      - name: Resolve only synthetic local Docker Compose configs (no Docker start)
        run: python -m scripts.valyqon_local_compose_preflight
