name: Asia Singapore GeBIZ public RSS shape research

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/asia_sg_gebiz_probe.py"
      - ".github/workflows/asia-sg-gebiz-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asia-gebiz-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  official-gebiz-anonymous-rss-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Classify anonymous official RSS HTTP and safe XML shape only
        run: python -m scripts.asia_sg_gebiz_probe
