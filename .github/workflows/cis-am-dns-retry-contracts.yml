name: CIS Armenia audited DNS retry contracts

on:
  push:
    branches:
      - fix/cis-am-real-dns-transient-20261018
    paths:
      - app/sources/am_armeps.py
      - tests/test_cis_am_real_dns_retry.py
      - .github/workflows/cis-am-dns-retry-contracts.yml
  pull_request:
    paths:
      - app/sources/am_armeps.py
      - tests/test_cis_am_real_dns_retry.py
      - .github/workflows/cis-am-dns-retry-contracts.yml

permissions:
  contents: read

jobs:
  classified-real-resolver-fault:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require DNS retry only for pinned audited resolver OSError
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q tests/test_cis_am_real_dns_retry.py tests/test_cis_am_tj_main_integration.py
