name: RU MikroTon strict real API Worker and tenant acceptance for price repair
on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/mikroton_tender.py
      - tests/test_mikroton_tender.py
      - tests/test_ru_mikroton_real_api.py
      - tests/test_ru_mikroton_worker_contract.py
      - scripts/ci_ru_mikroton_real_api.py
      - scripts/ci_ru_mikroton_real_worker.py
      - scripts/ci_ru_mikroton_authenticated.py
permissions:
  contents: read
jobs:
  mikroton-safe-native-json-price-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require strict native API schema with no unbounded JSON number crash
        run: python -m pytest -q tests/test_mikroton_tender.py tests/test_ru_mikroton_real_api.py tests/test_ru_mikroton_worker_contract.py

  mikroton-current-real-publisher-api:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require current first-party list and separately fetched native API detail
        timeout-minutes: 5
        run: python -B -m scripts.ci_ru_mikroton_real_api

  mikroton-real-leased-worker-sql-user-search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require genuine current official records to durable Worker SQLite and title query
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_mikroton_real_worker

  mikroton-real-authenticated-tenant-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require genuine official procurement details in authorized customer scoring
        timeout-minutes: 8
        run: python -B -m scripts.ci_ru_mikroton_authenticated
