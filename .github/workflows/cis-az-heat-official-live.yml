name: CIS Azerbaijan official heat-procurement discovery
on:
  push:
    branches:
      - research/cis-az-heat-public-20261017
    paths:
      - scripts/ci_cis_az_heat_live_discovery.py
      - tests/test_cis_az_heat_offline.py
      - app/sources/az_azeristilik.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/sources/http.py
      - scripts/ci_cis_az_heat_live_acceptance.py
      - scripts/diagnose_cis_az_heat_bounded.py
      - tests/test_cis_az_bounded_stale_status.py
      - tests/test_cis_az_heat_adapter.py
      - tests/test_connector_workers.py
      - tests/test_source_catalog.py
      - .github/workflows/cis-az-heat-official-live.yml
  pull_request:
    paths:
      - scripts/ci_cis_az_heat_live_discovery.py
      - tests/test_cis_az_heat_offline.py
      - app/sources/az_azeristilik.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/sources/http.py
      - scripts/ci_cis_az_heat_live_acceptance.py
      - scripts/diagnose_cis_az_heat_bounded.py
      - tests/test_cis_az_bounded_stale_status.py
      - tests/test_cis_az_heat_adapter.py
      - tests/test_connector_workers.py
      - tests/test_source_catalog.py
      - .github/workflows/cis-az-heat-official-live.yml

permissions:
  contents: read

jobs:
  az-official-offline-contract:
    name: Strict official Azeri tender row and deadline contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject fake index and fake deadlines
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p 'test_cis_az_heat_offline.py' -v

  az-official-https-evidence:
    name: Current official Azeri list and linked notices
    needs: az-official-offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require actual HTTPS listing and full published submission deadline
        timeout-minutes: 4
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/ci_cis_az_heat_live_discovery.py

  az-adapter-contract:
    name: Azeri adapter strict normalization and catalog contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check normalized real shape, no budget hallucination, and source flags
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s tests -p 'test_cis_az_heat_adapter.py' -v
          python -B -m pytest -q tests/test_cis_az_bounded_stale_status.py tests/test_cis_az_official_tcp_reset.py tests/test_connector_workers.py tests/test_source_catalog.py

  az-real-worker-sqlite-query:
    name: Azeri real HTTPS notices, fenced worker, disposable SQLite and saved search
    needs: [az-official-https-evidence, az-adapter-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable acceptance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Require official actual details persisted and queryable without production
        timeout-minutes: 7
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHON_DOTENV_DISABLED: '1'
        run: python -B -m scripts.ci_cis_az_heat_live_acceptance --source az_azeristilik
      - name: Diagnose only blocked first-party cards without approving source
        if: failure()
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHON_DOTENV_DISABLED: '1'
        run: python -B -m scripts.diagnose_cis_az_heat_bounded
