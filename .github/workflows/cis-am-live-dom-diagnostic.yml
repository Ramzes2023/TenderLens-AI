name: CIS Armenia official source live DOM diagnosis
on:
  push:
    branches:
      - fix/cis-am-real-dns-transient-20261018
    paths:
      - scripts/ci_cis_am_live_dom_diagnostic.py
      - tests/test_cis_am_live_dom_retry.py
      - .github/workflows/cis-am-live-dom-diagnostic.yml
permissions:
  contents: read
jobs:
  armenia-official-listing-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Offline strict retry contract; never an upstream availability pass
        run: python -B -m pytest -q tests/test_cis_am_live_dom_retry.py
      - name: Diagnose pinned official listing without logging real notice content
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHON_DOTENV_DISABLED: '1'
        run: python -B -m scripts.ci_cis_am_live_dom_diagnostic
