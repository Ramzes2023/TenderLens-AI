name: RU NMCK native small-procurement discovery and foreign-mirror exclusion
on:
  push:
    branches: [research/ru-nmck-native-independent-20261017]
    paths:
      - app/sources/http.py
      - scripts/research_ru_nmck_public.py
      - tests/test_ru_nmck_public.py
      - .github/workflows/ru-nmck-public-research.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_nmck_public.py
      - tests/test_ru_nmck_public.py
      - .github/workflows/ru-nmck-public-research.yml
permissions:
  contents: read
jobs:
  nmck-native-offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject foreign syndicated tenders and require exact visible number on official detail
        run: python -m pytest -q tests/test_ru_nmck_public.py
  nmck-native-two-real-detail-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Real source first-party list and two independently verified official detail pages
        timeout-minutes: 4
        run: python -B -m scripts.research_ru_nmck_public
