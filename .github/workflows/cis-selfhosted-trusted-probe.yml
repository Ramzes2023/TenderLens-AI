name: CIS INT-02 trusted self-hosted runner diagnostic

# This is an OWNER-CONTROLLED push branch, NEVER pull_request or pull_request_target.
# No checkout or untrusted repository code runs in this diagnostic.
on:
  push:
    branches:
      - fix/cis-postgres16-fencing-gate-20261015
    paths:
      - .github/workflows/cis-selfhosted-trusted-probe.yml

permissions: {}

concurrency:
  group: valyqon-cis-trusted-runner-diagnostic
  cancel-in-progress: true

jobs:
  inspect-runner:
    name: Trusted runner environment only (no PR code)
    runs-on: valyqon-int
    timeout-minutes: 5
    steps:
      - name: Verify Linux tools without checkout or secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_NAME:-}" != "VALYQON-INT-02" ]]; then
            echo "CIS_RUNNER_PROBE=UNEXPECTED_RUNNER"
            exit 12
          fi
          echo "CIS_RUNNER_PROBE=START"
          echo "OS=$(uname -s)"
          echo "ARCH=$(uname -m)"
          if command -v python3 >/dev/null; then python3 --version; else echo "PYTHON3=MISSING"; fi
          if command -v git >/dev/null; then git --version; else echo "GIT=MISSING"; fi
          echo "RUNNER_UID=$(id -u)"
          echo "RUNNER_DOCKER_GROUP=$(id -nG | tr ' ' '\\n' | grep -xc docker || true)"
          if command -v docker >/dev/null; then
            docker --version
            echo "DOCKER_HOST_OVERRIDE=$([[ -n "${DOCKER_HOST:-}" ]] && echo SET || echo UNSET)"
            for socket in /var/run/docker.sock /mnt/wsl/docker-desktop/shared-sockets/guest-services/docker.sock; do
              if [[ "$socket" == "/var/run/docker.sock" ]]; then
                if [[ -w "$socket" ]]; then
                  echo "DOCKER_DEFAULT_SOCKET_ACCESS=WRITABLE"
                else
                  echo "DOCKER_DEFAULT_SOCKET_ACCESS=NOT_WRITABLE"
                fi
              fi
              if [[ -S "$socket" ]]; then
                echo "DOCKER_SOCKET_${socket//\\//_}=SOCKET_PRESENT"
                stat -Lc 'DOCKER_SOCKET_MODE=%A;OWNER=%U;GROUP=%G' "$socket"
              elif [[ -e "$socket" || -L "$socket" ]]; then
                echo "DOCKER_SOCKET_${socket//\\//_}=PATH_NOT_SOCKET"
              else
                echo "DOCKER_SOCKET_${socket//\\//_}=ABSENT"
              fi
            done
            # Do not print the Docker context endpoint or raw environment.
            set +e
            output=$(timeout 15s docker info --format '{{.ServerVersion}}' 2>&1)
            code=$?
            set -e
            if [[ "$code" -eq 0 ]]; then
              echo "DOCKER_DAEMON=READY"
            else
              echo "DOCKER_DAEMON=UNAVAILABLE;EXIT=$code"
              if [[ "$code" -eq 124 ]]; then
                echo "DOCKER_FAILURE=TIMEOUT"
              elif [[ "$output" == *"permission denied"* ]]; then
                echo "DOCKER_FAILURE=PERMISSION_DENIED"
              elif [[ "$output" == *"Cannot connect to the Docker daemon"* || "$output" == *"connection refused"* ]]; then
                echo "DOCKER_FAILURE=ENGINE_UNREACHABLE"
              elif [[ "$output" == *"no such file or directory"* ]]; then
                echo "DOCKER_FAILURE=SOCKET_MISSING"
              else
                echo "DOCKER_FAILURE=OTHER"
              fi
            fi
          else echo "DOCKER_CLI=MISSING"; fi
          if command -v psql >/dev/null; then psql --version; else echo "PSQL_CLIENT=MISSING"; fi
          if command -v python3 >/dev/null; then
            python3 - <<'PY'
          import importlib.util
          for name in ("pytest", "psycopg", "httpx", "fastapi"):
              print("PYTHON_MODULE_" + name.upper() + "=" + ("PRESENT" if importlib.util.find_spec(name) else "MISSING"))
          PY
          fi
          echo "CIS_RUNNER_PROBE=PASS"

      - name: Pull public Python image with empty isolated Docker credentials
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "VALYQON-INT-02" ]]
          authless_dir=$(mktemp -d)
          trap 'rm -rf -- "$authless_dir"' EXIT
          chmod 700 "$authless_dir"
          printf '{"auths":{}}\\n' > "$authless_dir/config.json"
          chmod 600 "$authless_dir/config.json"
          if timeout 180s env DOCKER_CONFIG="$authless_dir" docker pull --quiet python:3.12-slim; then
            echo "CIS_PUBLIC_IMAGE_PULL=PASS"
          else
            echo "::error::Public Docker pull failed even with isolated empty credentials; inspect WSL networking and daemon."
            exit 1
          fi
