name: RU Fabrikant plain published-list transport research

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_fabrikant_unfiltered_published.py
      - tests/test_research_ru_fabrikant_unfiltered_published.py
      - .github/workflows/ru-fabrikant-unfiltered-published-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-firstparty-list-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: "1"
      TELEGRAM_BOT_TOKEN: ""
      OUTBOUND_PROXY_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source contracts
        run: python -m pip install -r requirements-dev.txt
      - name: Adversarial original-anchor, disabled-source and fixed-URL tests
        run: python -m pytest -q tests/test_research_ru_fabrikant_unfiltered_published.py
      - name: Genuine two hosts × published plain/sorted firstparty GET
        timeout-minutes: 4
        run: python -B -m scripts.research_ru_fabrikant_unfiltered_published
      - name: No region ingestion or production change
        run: |
          echo "INGUSHETIA_CHECHNYA_REGIONAL_DISCOVERY=NOT_PROVED"
          echo "LEASED_WORKER_SQL_GUEST=NOT_PROVED"
          echo "PUBLIC_SIDE_CAR_CHANGED=NO"
