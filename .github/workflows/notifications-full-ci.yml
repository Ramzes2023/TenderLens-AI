name: VALYQON Notifications Full Linux Windows Docker

# Audit-only: run the existing full CI jobs on the QA branch because PR #280
# targets an intermediate feature branch, not main. No production deployment.
on:
  push:
    branches:
      - feat/notifications-delivery-journal-20261024
  workflow_dispatch:


permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Restore pinned official eForms CPV reference
        run: |
          mkdir -p .cache/phase24p33-completion
          curl --fail --location --show-error --silent --retry 2 --connect-timeout 15 --max-time 180 \
            'https://raw.githubusercontent.com/OP-TED/eForms-SDK/1.15.1/codelists/cpv.gc' \
            --output .cache/phase24p33-completion/official_eforms_cpv.gc
          printf '%s  %s\n' \
            'e8f48feedb63ce1583caa22825011afccd402973c28a885c2e81f89460fd6301' \
            '.cache/phase24p33-completion/official_eforms_cpv.gc' | sha256sum --check --status
      - name: Restore pinned TED search-field evidence
        run: |
          mkdir -p .cache/phase24p33-completion
          curl --fail --location --show-error --silent --retry 2 --connect-timeout 15 --max-time 120 \
            'https://docs.ted.europa.eu/ODS/latest/reuse/field-list.html' \
            --output .cache/phase24p33-completion/official_ted_search_fields.html
          printf '%s  %s\n' \
            '79324dc627ee846f137e8cf4d069509784d51dcc7770f592dcd58096e261a419' \
            '.cache/phase24p33-completion/official_ted_search_fields.html' | sha256sum --check
      - name: Restore pinned eForms SDK example and lot schema
        run: |
          mkdir -p .cache/phase24p33-xml-context
          cp tests/fixtures/eforms/official_sdk_cn_24_minimal.xml \
            .cache/phase24p33-xml-context/official_sdk_cn_24_minimal.xml
          printf '%s  %s\n' \
            '3bba90994d3e7d86ed8bb07f5c2fc49b8be27523b9ac5397c83ee86312b43ef8' \
            '.cache/phase24p33-xml-context/official_sdk_cn_24_minimal.xml' | sha256sum --check
          curl --fail --location --show-error --silent --retry 2 --connect-timeout 15 --max-time 120 \
            'https://docs.ted.europa.eu/eforms/latest/schema/procedure-lot-part-information.html' \
            --output .cache/phase24p33-xml-context/official_eforms_lot_schema.html
          printf '%s  %s\n' \
            '79241647c6acae10fcf61b3112cef35228339c632c664bfc4f8101f82c0556bd' \
            '.cache/phase24p33-xml-context/official_eforms_lot_schema.html' | sha256sum --check
      - name: Validate synthetic fixture byte commitment
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('tests/fixtures/p39d_offline_history.json')
          expected = '6d7ff62145ca4c05388d988419ccd4343c269e842c0614bab0ea3edbdbbccfaf'
          original = path.read_bytes()
          lf = original.removeprefix(b'\xef\xbb\xbf').replace(b'\r\n', b'\n')
          variants = {
              'original': original,
              'utf8_lf': lf,
              'utf8_lf_no_final_newline': lf.rstrip(b'\r\n'),
              'utf8_lf_with_final_newline': lf.rstrip(b'\r\n') + b'\n',
              'utf8_crlf': lf.replace(b'\n', b'\r\n'),
              'utf8_crlf_with_final_newline': lf.rstrip(b'\r\n').replace(b'\n', b'\r\n') + b'\r\n',
          }
          for label, data in variants.items():
              if hashlib.sha256(data).hexdigest() == expected:
                  if data != original:
                      path.write_bytes(data)
                  print('PINNED_FIXTURE=VERIFIED; FORM=' + label)
                  break
          else:
              print('PINNED_FIXTURE=MISMATCH_NO_FORMAT_MATCH')
              print('FIXTURE_SHA256=' + hashlib.sha256(original).hexdigest())
              print('FIXTURE_SIZE=' + str(len(original)))
              print('NO_CHECKSUM_REPLACEMENT=YES')
          PY
      - name: Compile
        run: python -m compileall -q app tests scripts
      - name: Test (Linux-compatible suite)
        run: python -m pytest -q --durations=15 --ignore=tests/test_p39e_local_preview.py

  windows-offline-fixture:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Windows-only offline fixture tools
        run: python -m compileall -q app tests scripts
      - name: Test Windows-only process isolation and offline preview
        run: python -m pytest -vv --maxfail=1 --durations=15 tests/test_p39e_local_preview.py
      - name: Parse private AWS preview launcher without SSH or network
        shell: pwsh
        run: |
          $plan = & ./ops/private_preview/launch_aws_preview.ps1 -PlanOnly | Out-String
          if ($plan -notmatch 'PLAN_ONLY=YES' -or $plan -notmatch 'valyqon-private-preview') {
            throw 'The private preview launcher did not pass its network-free plan.'
          }

  docker-build:
    runs-on: ubuntu-latest
    needs: [tests, windows-offline-fixture]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t tenderlens-ai:ci .
