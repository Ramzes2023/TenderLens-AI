        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Ten independently verified original South Ural tenders through fenced queue SQLite and keyword search
        timeout-minutes: 5
        run: python -B -m scripts.ci_ru_south_ural_10_real_worker
      - name: Real South Ural notices into authenticated tenant scoring with access isolation
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_south_ural_authenticated
