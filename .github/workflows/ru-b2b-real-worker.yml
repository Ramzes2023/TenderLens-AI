name: RU B2B verified real worker acceptance

on:
  push:
    branches:
      - feat/ru-b2b-real-worker-acceptance-20261015
    paths:
      - scripts/ci_ru_b2b_real_worker.py
      - .github/workflows/ru-b2b-real-worker.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/ci_ru_b2b_real_worker.py
      - .github/workflows/ru-b2b-real-worker.yml
      - app/sources/b2b_center.py
      - app/sources/ingestion.py
      - app/sources/catalog.py
      - app/sources/opportunities.py

permissions:
  contents: read

jobs:
  b2b-real-worker:
    # Hosted runner only: never run untrusted pull_request code on the laptop.
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Python source
        run: python -m py_compile scripts/ci_ru_b2b_real_worker.py
      - name: Real B2B -> app worker -> ephemeral SQLite -> source keyword query
        timeout-minutes: 3
        run: python -B scripts/ci_ru_b2b_real_worker.py
