name: RU MikroTon daily real tender ingestion and search
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
  push:
    branches: [ci/ru-mikroton-daily-live-lease-20261018]
    paths:
      - .github/workflows/ru-mikroton-daily-live-health.yml
      - tests/test_ru_mikroton_daily_live_health.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ru-mikroton-daily-live-health.yml
      - tests/test_ru_mikroton_daily_live_health.py
permissions:
  contents: read
concurrency:
  group: ru-mikroton-live-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  mikroton-health-security-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML pytest
      - name: Verify strict source health live coverage, no runner secrets and no bypass
        run: python -m pytest -q tests/test_ru_mikroton_daily_live_health.py
  mikroton-official-api-real-leased-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify actual official public API and independently corroborated notice detail
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_mikroton_real_api
      - name: Real durable leased Worker to disposable SQLite and saved keyword search
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_mikroton_real_worker
  mikroton-real-authenticated-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Real independently verified MikroTon notices into authenticated tenant scoring
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_mikroton_authenticated
