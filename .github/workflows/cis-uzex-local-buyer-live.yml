name: CIS Uzbekistan UzEx actual district buyer persisted search
on:
  push:
    branches: [research/cis-uzex-local-buyer-live-20261018]
    paths:
      - scripts/ci_cis_uzex_local_buyer_live.py
      - .github/workflows/cis-uzex-local-buyer-live.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/ci_cis_uzex_local_buyer_live.py
      - .github/workflows/cis-uzex-local-buyer-live.yml
permissions:
  contents: read
jobs:
  uzex-local-buyer-official-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Real official UzEx tenders → fenced Worker → disposable SQLite → district buyer saved search
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHON_DOTENV_DISABLED: '1'
        run: python -B -m scripts.ci_cis_uzex_local_buyer_live --source uz_uzex
