name: RU GPB corporate public index recovery gate
on:
  push:
    branches: [research/ru-gpb-public-firstparty-live-recovery-20261018]
    paths:
      - app/sources/gpb_etp_public.py
      - scripts/research_ru_gpb_public_route_recovery.py
      - scripts/research_ru_gpb_gos_html_originals.py
      - tests/test_ru_gpb_gos_html_originals.py
      - tests/test_ru_gpb_route_recovery.py
      - tests/test_ru_gpb_public.py
      - .github/workflows/ru-gpb-public-route-recovery.yml
  pull_request:
    branches: [main]
    paths:
      - app/sources/gpb_etp_public.py
      - scripts/research_ru_gpb_public_route_recovery.py
      - scripts/research_ru_gpb_gos_html_originals.py
      - tests/test_ru_gpb_gos_html_originals.py
      - tests/test_ru_gpb_route_recovery.py
      - tests/test_ru_gpb_public.py
      - .github/workflows/ru-gpb-public-route-recovery.yml
permissions:
  contents: read
jobs:
  original-url-contract-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_ru_gpb_public.py tests/test_ru_gpb_route_recovery.py
  two-published-firstparty-index-routes-live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Anonymous official GPB index gate, no cookie or TLS bypass
        run: python -B -m scripts.research_ru_gpb_public_route_recovery

  genuine-gpb-gos44-originals-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject spoofed and mismatched source detail pages
        run: python -B -m pytest -q tests/test_ru_gpb_gos_html_originals.py

  two-official-gpb-gos44-first-party-details:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Prove first-party published pages from new official GPB Gos44 host
        timeout-minutes: 5
        run: python -B -m scripts.research_ru_gpb_gos_html_originals
