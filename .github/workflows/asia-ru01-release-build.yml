name: Asia verified production Docker build (RU-01)

# Docker build parity for a reviewed branch on our free self-hosted machine.
# No PR workflow trigger, no workflow-provided credentials, no AWS.
on:
  push:
    branches: [feat/asia-public-procurement-six-20261015]
    paths: [".github/workflows/asia-ru01-release-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asia-release-container-build:
    if: github.repository == 'Ramzes2023/TenderLens-AI' && github.ref == 'refs/heads/feat/asia-public-procurement-six-20261015'
    runs-on: valyqon-ru
    timeout-minutes: 25
    steps:
      - name: Check trusted runner and Docker WSL2
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = "VALYQON-RU-01"
          test "$(id -u)" != "0"
          if mountpoint -q /mnt/c; then exit 2; fi
          for attempt in 1 2 3; do
            if timeout 20s sg docker -c "docker info >/dev/null 2>&1"; then
              echo "ASIA_BUILD_DOCKER_READY=YES"
              exit 0
            fi
            sleep 5
          done
          echo "ASIA_BUILD_DOCKER_READY=NO"
          exit 3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
          submodules: false
          fetch-depth: 0
      - name: Reject unreviewed change to build recipe or manifests
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD origin/main -- Dockerfile requirements.txt requirements-dev.txt || {
            echo "ASIA_BUILD_INPUT_POLICY=BLOCKED"
            exit 4
          }
          echo "ASIA_BUILD_INPUT_POLICY=MAIN_REVIEWED"
      - name: Build actual production image with anonymous registry access
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          umask 077
          config="$RUNNER_TEMP/asia-release-anonymous-docker"
          mkdir -p "$config"
          printf '{"auths":{}}\n' > "$config/config.json"
          image="valyqon-asia-build:$(git rev-parse --short=12 HEAD)"
          echo "ASIA_PRODUCTION_BUILD_IMAGE=$image" >> "$GITHUB_ENV"
          quoted_config="$(printf '%q' "$config")"
          quoted_image="$(printf '%q' "$image")"
          quoted_workspace="$(printf '%q' "$GITHUB_WORKSPACE")"
          timeout 1020s sg docker -c "DOCKER_CONFIG=$quoted_config docker build --progress=plain -f $quoted_workspace/Dockerfile -t $quoted_image $quoted_workspace"
          echo "ASIA_PRODUCTION_DOCKER_BUILD=PASS"
      - name: Clean only disposable CI image
        if: always()
        shell: bash
        run: |
          if test -n "${ASIA_PRODUCTION_BUILD_IMAGE:-}"; then
            quoted_image="$(printf '%q' "$ASIA_PRODUCTION_BUILD_IMAGE")"
            timeout 25s sg docker -c "docker image rm $quoted_image >/dev/null 2>&1" || true
          fi
          echo "AWS_CHANGED=NO"
          echo "PRODUCTION_CHANGED=NO"
