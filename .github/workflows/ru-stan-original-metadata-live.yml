name: RU STAN original buyer price deadline to searchable SQL
on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/stan_commercial_public.py
      - tests/test_ru_stan_public_metadata.py
      - scripts/ci_ru_stan_metadata_live_sql.py
      - .github/workflows/ru-stan-original-metadata-live.yml
  push:
    branches: [feat/ru-stan-metadata-sql-evidence-20261018]
    paths:
      - app/sources/stan_commercial_public.py
      - tests/test_ru_stan_public_metadata.py
      - scripts/ci_ru_stan_metadata_live_sql.py
      - .github/workflows/ru-stan-original-metadata-live.yml
permissions:
  contents: read
jobs:
  stan-metadata-strict-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject forged origin, buyer, timezone or currency and require local SQL search
        run: python -m pytest -q tests/test_ru_stan_public_metadata.py tests/test_ru_stan_commercial_adapter.py
  stan-metadata-real-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Two authentic original commercial buyers and Moscow deadlines survive SQLite buyer search
        timeout-minutes: 5
        run: python -B -m scripts.ci_ru_stan_metadata_live_sql
