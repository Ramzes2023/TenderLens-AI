name: RU MikroTon and TEK-Torg genuine leased acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ci_ru_mikroton_real_worker.py
      - scripts/ci_ru_tektorg_real_worker.py
      - tests/test_ru_remaining_real_leases.py
      - .github/workflows/ru-remaining-real-leases.yml
  push:
    branches: [fix/ru-remaining-real-leases-reconcile-20261018]
    paths:
      - scripts/ci_ru_mikroton_real_worker.py
      - scripts/ci_ru_tektorg_real_worker.py
      - tests/test_ru_remaining_real_leases.py
      - .github/workflows/ru-remaining-real-leases.yml
permissions:
  contents: read
jobs:
  leased-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Genuine SQLite JobRepository lease and disabled-source refusal
        run: python -m pytest -q tests/test_ru_remaining_real_leases.py
  mikroton-official-live-leased-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Actual MikroTon official API and independent original detail
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_mikroton_real_api
      - name: Actual MikroTon leased Worker to disposable SQLite and saved-search
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_mikroton_real_worker
      - name: Actual MikroTon stored items to authenticated tenant scoring
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_mikroton_authenticated
  tektorg-official-live-leased-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Actual TEK-Torg independently verified official list/details to fenced SQLite
        timeout-minutes: 5
        run: python -B -m scripts.ci_ru_tektorg_real_worker
