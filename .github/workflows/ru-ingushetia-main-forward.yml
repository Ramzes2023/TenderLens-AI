name: RU Ingushetia main-first conflict-free integration contracts
on:
  pull_request:
    paths:
      - 'app/monitoring/config.py'
      - 'app/sources/**'
      - 'tests/test_ru_ingushetia_main_forward.py'
      - 'tests/test_ru_approved_operator_cycle.py'
      - '.github/workflows/ru-ingushetia-main-forward.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingushetia-main-forward-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate sources, approved queue and current main catalog
        run: python -m pytest -q tests/test_ru_ingushetia_main_forward.py tests/test_ru_approved_operator_cycle.py tests/test_source_catalog.py tests/test_ru_source_integration_contract.py
      - name: Compile sources
        run: python -m compileall -q app/sources
