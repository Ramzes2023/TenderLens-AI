      - run: python -m pip install -r requirements-dev.txt
      - name: Official Lenobl independently verified purchases -> fenced SQL -> keyword lookup
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_lenobl_real_worker
      - name: Official Lenobl real purchases -> authorized scorer and tenant denial
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_lenobl_authenticated
  nmck-native-public-signal:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
