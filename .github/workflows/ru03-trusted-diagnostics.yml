name: RU-03 trusted read-only source diagnosis

# Trusted, branch-scoped, explicit push workflow. No PR code or repository checkout.
on:
  push:
    branches:
      - ops/ru3-trusted-source-probe-20261016
    paths:
      - .github/workflows/ru03-trusted-diagnostics.yml

permissions: {}

jobs:
  check-ru3-public-https:
    if: github.repository == 'Ramzes2023/TenderLens-AI' && github.ref == 'refs/heads/ops/ru3-trusted-source-probe-20261016'
    runs-on: valyqon-ru3
    timeout-minutes: 6
    steps:
      - name: Verify correct third WSL host
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = "VALYQON-ASIA-03"
          test "$(id -un)" = "valyqon"
          test "$(uname -s)" = "Linux"
          if mountpoint -q /mnt/c; then
            echo "RU3_SECURITY_WINDOWS_DRIVE_MOUNTED=YES"
            exit 1
          fi
          echo "RU3_VERIFIED_RUNNER=PASS"
      - name: Probe four explicit public Russian source URLs without TLS bypass
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for source in eis44 eis223 b2b mikroton; do
            case "$source" in
              eis44) url='https://zakupki.gov.ru/epz/order/extendedsearch/rss.html?fz44=on' ;;
              eis223) url='https://zakupki.gov.ru/epz/order/extendedsearch/rss.html?fz223=on' ;;
              b2b) url='https://www.b2b-center.ru/search/' ;;
              mikroton) url='https://tender.mt52.ru/api/v1/tenders?page=1&page_size=10' ;;
            esac
            path="$tmp/$source"
            status=none
            mime=none
            if result="$(curl --noproxy '*' --silent --show-error --proto '=https' --max-redirs 0 --connect-timeout 8 --max-time 25 --max-filesize 2097152 --output "$path" --write-out '%{http_code} %{content_type}' "$url" 2>"$tmp/error")"; then
              status="${result%% *}"
              mime="${result#* }"
              size="$(wc -c < "$path" | tr -d ' ')"
              printf 'RU3_%s_HTTP=%s MIME=%s BYTES=%s\n' "$source" "$status" "$mime" "$size"
              if test "$source" = b2b && test "$status" = 200; then
                python3 - "$path" <<'PY'
          import sys
          from html.parser import HTMLParser
          class Shape(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.listitems = 0
                  self.demands = 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'div' and a.get('itemtype') == 'https://schema.org/ListItem':
                      self.listitems += 1
                  if a.get('itemtype') == 'https://schema.org/Demand':
                      self.demands += 1
          p = Shape()
          with open(sys.argv[1], encoding='utf-8-sig') as f:
              for line in f:
                  p.feed(line)
          print(f'RU3_B2B_HTML_SHAPES=LISTITEMS:{p.listitems},DEMANDS:{p.demands}')
          PY
              fi
            else
              rc="$?"
              printf 'RU3_%s_BLOCKED=CURL_EXIT_%s\n' "$source" "$rc"
            fi
          done
          echo 'RU3_REAL_TENDERS_DB_QUERY_VERIFIED=NO'
          echo 'PRODUCTION_CHANGED=NO'
      - name: Diagnose source TLS verifier metadata
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp)"
          trap 'rm -f "$temp"' EXIT
          if timeout 15s openssl s_client -connect zakupki.gov.ru:443 -servername zakupki.gov.ru -showcerts </dev/null >"$temp" 2>/dev/null; then
            echo 'RU3_EIS_TLS_HANDSHAKE=CONNECTED'
          else
            echo 'RU3_EIS_TLS_HANDSHAKE=FAILED'
          fi
          grep -E '^Verify return code:' "$temp" || true
          echo 'RU3_EIS_TLS_CERT_NOT_ADDED_TO_TRUST_STORE=YES'

      - name: Strict real MikroTon API notice and detail into disposable SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sqlite3
          import ssl
          import tempfile
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit

          HOST = 'tender.mt52.ru'
          BASE = 'https://tender.mt52.ru/api/v1'
          URLS = (BASE + '/tenders?page=1&page_size=10',
                  BASE + '/tenders/archive?page=1&page_size=10')
          MAX_BYTES = 1_048_576

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          client = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              NoRedirect(),
          )

          def fetch(url):
              parsed = urlsplit(url)
              if (parsed.scheme != 'https' or parsed.hostname != HOST or parsed.port is not None
                      or parsed.username or parsed.password or parsed.fragment):
                  raise ValueError('Rejected API destination')
              req = urllib.request.Request(url, headers={'Accept': 'application/json'})
              with client.open(req, timeout=15) as response:
                  if response.status != 200 or 'json' not in response.headers.get('Content-Type', '').lower():
                      raise ValueError('Public API HTTP/schema mismatch')
                  size = response.headers.get('Content-Length')
                  if size is not None and int(size) > MAX_BYTES:
                      raise ValueError('Oversized API content')
                  body = response.read(MAX_BYTES + 1)
              if not body or len(body) > MAX_BYTES:
                  raise ValueError('Empty/oversized API response')
              return json.loads(body)

          def canonical(row):
              if type(row) is not dict:
                  raise ValueError('Non-object notice')
              identity, title, url = row.get('id'), row.get('title'), row.get('portal_url')
              if type(identity) is not int or identity < 1 or type(title) is not str or not title.strip():
                  raise ValueError('Missing tender identity/title')
              if (type(url) is not str or
                      url != f'https://{HOST}/tenders/{identity}'):
                  raise ValueError('Missing canonical notice URL')
              return identity, title, url

          discovered = {}
          for url in URLS:
              doc = fetch(url)
              if (type(doc) is not dict or type(doc.get('meta')) is not dict
                      or doc['meta'].get('api_version') != 'v1'
                      or type(doc.get('items')) is not list or len(doc['items']) > 10):
                  raise ValueError('API list schema unsupported')
              for row in doc['items']:
                  identity, title, portal = canonical(row)
                  if identity in discovered and discovered[identity] != (title, portal):
                      raise ValueError('Conflicting API identity')
                  discovered[identity] = (title, portal)
          if not discovered:
              raise ValueError('No real public tender records')

          first_id = next(iter(discovered))
          detail = fetch(f'{BASE}/tenders/{first_id}')
          if (type(detail) is not dict or detail.get('id') != first_id
                  or detail.get('title') != discovered[first_id][0]):
              raise ValueError('Notice detail identity mismatch')

          with tempfile.TemporaryDirectory(prefix='valyqon-ru3-mikroton-') as folder:
              db = sqlite3.connect(str(Path(folder) / 'public-notices.sqlite'))
              try:
                  db.execute('CREATE TABLE notices (id INTEGER PRIMARY KEY, title TEXT NOT NULL, url TEXT NOT NULL)')
                  db.executemany('INSERT INTO notices (id,title,url) VALUES (?,?,?)',
                                 [(identity, *values) for identity, values in discovered.items()])
                  db.commit()
                  for identity, (title, url) in discovered.items():
                      row = db.execute('SELECT title,url FROM notices WHERE id=?', (identity,)).fetchone()
                      if row != (title, url):
                          raise ValueError('SQL roundtrip failed')
                  stored = db.execute('SELECT COUNT(*) FROM notices').fetchone()[0]
                  if stored != len(discovered):
                      raise ValueError('SQL count mismatch')
              finally:
                  db.close()

          print(f'RU3_MIKROTON_REAL_NOTICES={len(discovered)}')
          print('RU3_MIKROTON_DETAIL_IDENTITY=PASS')
          print('RU3_MIKROTON_SQLITE_ROUNDTRIP=PASS')
          print('RU3_MIKROTON_PRODUCTION_CHANGED=NO')
          PY
