name: Türkiye Ankara ASKİ real open government procurement acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/tr_aski_water.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - tests/test_tr_aski_water.py
      - scripts/asia_tr_aski_real_worker.py
      - .github/workflows/asia-tr-aski-live-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: turkey-aski-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tr-aski-water-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_tr_aski_water.py tests/test_tr_ankara_municipality.py
  tr-aski-real-government-water-tenders:
    runs-on: ubuntu-latest
    needs: [tr-aski-water-offline]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Genuine government page → leased worker → disposable SQLite → public keyword search
        env:
          VALYQON_ASIA_TURKEY_ASKI_ENABLED: '1'
        run: python -m scripts.asia_tr_aski_real_worker
