name: RU Stavropol independent regional small procurement original verification
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_stavropol_rts_small.py
      - tests/test_ru_stavropol_rts_small.py
      - .github/workflows/ru-stavropol-market-originals-research.yml
  push:
    branches: [research/ru-stavropol-rts-market-originals-20261018]
    paths:
      - scripts/research_ru_stavropol_rts_small.py
      - tests/test_ru_stavropol_rts_small.py
      - .github/workflows/ru-stavropol-market-originals-research.yml
permissions:
  contents: read
jobs:
  stavropol-native-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify original identity and reject login, foreign host and fabricated detail
        run: python -m pytest -q tests/test_ru_stavropol_rts_small.py
  stavropol-native-live-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Independently corroborate two first-party original Stavropol small purchases
        timeout-minutes: 5
        run: python -B -m scripts.research_ru_stavropol_rts_small
  stavropol-fixed-public-diagnostic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Classify fixed first-party HTTPS status and DNS with no redirect, proxy or TLS override
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --noproxy '*' --silent --show-error --proto '=https' \
            --max-redirs 0 --connect-timeout 8 --max-time 20 --output /dev/null \
            --write-out '%{http_code}' 'https://market26.rts-tender.ru/')" && code=0 || code=$?
          echo "RU_STAVROPOL_PUBLIC_HTTP=$result"
          echo "RU_STAVROPOL_CURL_EXIT=$code"
          echo "DIAGNOSTIC_ONLY=YES"
          echo "PRODUCTION_CHANGED=NO"
