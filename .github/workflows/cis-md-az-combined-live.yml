name: CIS Moldova and two Azerbaijan sources real shared SQLite search

on:
  push:
    branches:
      - integration/cis-md-az-verified-combined-20261018
    paths:
      - app/sources/md_elicitatie.py
      - app/sources/az_azeristilik.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/monitoring/config.py
      - scripts/ci_cis_md_az_combined_live.py
      - .github/workflows/cis-md-az-combined-live.yml
  pull_request:
    branches: [main]
    paths:
      - app/sources/md_elicitatie.py
      - app/sources/az_azeristilik.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/monitoring/config.py
      - scripts/ci_cis_md_az_combined_live.py
      - .github/workflows/cis-md-az-combined-live.yml

permissions:
  contents: read

jobs:
  same-real-database-two-independent-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Require both real live sites through common durable queue, SQLite and buyer searches
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHON_DOTENV_DISABLED: '1'
        run: python -B -m scripts.ci_cis_md_az_combined_live
