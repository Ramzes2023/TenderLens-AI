name: RU TEK-Torg live User-Agent source contracts
on:
  push:
    branches: [fix/ru-tektorg-live-ua-20261016]
    paths:
      - app/sources/tektorg_public_html.py
      - tests/test_ru_tektorg_public.py
      - scripts/ci_ru_tektorg_fenced_acceptance.py
      - .github/workflows/ru-tektorg-ua-regression.yml
  pull_request:
    branches: [main]
    paths:
      - app/sources/tektorg_public_html.py
      - tests/test_ru_tektorg_public.py
      - scripts/ci_ru_tektorg_fenced_acceptance.py
      - .github/workflows/ru-tektorg-ua-regression.yml
permissions:
  contents: read
jobs:
  tektorg-strict-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_ru_tektorg_public.py
      - run: python -m py_compile scripts/ci_ru_tektorg_fenced_acceptance.py
