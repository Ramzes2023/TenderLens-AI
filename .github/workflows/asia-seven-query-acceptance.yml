name: Asia seven official feeds persisted query acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "app/sources/asia_seven.py"
      - "app/sources/asia_public.py"
      - "app/sources/jp_jetro_bid_rss.py"
      - "tests/test_asia_seven_operations.py"
      - "scripts/asia_seven_live_query_acceptance.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asia-seven-query-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asia-seven-offline-queue-query:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Seven source operator and existing connector regression contracts
        run: python -m pytest -q tests/test_asia_seven_operations.py tests/test_jp_jetro_bid_rss.py tests/test_asia_public_sources.py tests/test_source_catalog.py tests/test_connector_workers.py
  asia-seven-real-queue-search:
    runs-on: ubuntu-latest
    needs: [asia-seven-offline-queue-query]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Real official seven feeds through connector queue, DB and stored keyword query
        env:
          VALYQON_ASIA_SOURCES_ENABLED: "1"
          VALYQON_ASIA_JETRO_BID_ENABLED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.asia_seven_live_query_acceptance
