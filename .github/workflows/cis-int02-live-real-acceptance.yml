name: CIS INT-02 real official-source ingestion acceptance

# Maintainer-controlled branch only; NEVER execute PR event payloads on the
# owner's laptop. No production DB, secrets, Docker auth, or host port bindings.
on:
  push:
    branches:
      - fix/cis-postgres16-fencing-gate-20261015
    paths:
      - ".github/workflows/cis-int02-live-real-acceptance.yml"
      - "scripts/ci_cis_int02_live_docker.sh"
      - "scripts/ci_cis_am_tj_live_acceptance.py"

permissions:
  contents: read

concurrency:
  group: valyqon-cis-int02-live-acceptance
  cancel-in-progress: true

jobs:
  official-https-to-sqlite-and-search:
    name: INT-02 real official HTTPS / ${{ matrix.source }}
    runs-on: valyqon-int
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [am_armeps, tj_eprocurement]
    steps:
      - name: Verify designated owner-controlled push, before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_NAME:-}" == "VALYQON-INT-02" ]]
          [[ "${GITHUB_EVENT_NAME:-}" == "push" ]]
          [[ "${GITHUB_REF:-}" == "refs/heads/fix/cis-postgres16-fencing-gate-20261015" ]]
          echo "CIS_LIVE_TRUSTED_CONTEXT=VERIFIED"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Acquire actual official notices, persist in disposable SQLite, and search
        shell: bash
        timeout-minutes: 25
        env:
          CIS_SOURCE: ${{ matrix.source }}
        run: bash scripts/ci_cis_int02_live_docker.sh "$CIS_SOURCE"
