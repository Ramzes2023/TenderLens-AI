name: RU Ingushetia official EIS tender acceptance (fail closed)
on:
  push:
    branches: [feat/ru-ingushetia-eis-live-gated-20261019]
    paths:
      - app/sources/ru_ingushetia_eis44.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/sources/ru_dedup.py
      - app/sources/ru_notice_identity.py
      - app/monitoring/config.py
      - tests/test_ru_ingushetia_eis44.py
      - scripts/ci_ru_ingushetia_live_worker.py
      - .github/workflows/ru-ingushetia-eis-live.yml
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ingushetia-strict-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject unproven region, unsafe EIS URL and duplicate alerts
        run: python -m pytest -q tests/test_ru_ingushetia_eis44.py tests/test_ru_source_integration_contract.py tests/test_ru_original_notice_identity.py tests/test_ru_tenders_confirmed_send.py
  ingushetia-real-rss-original-worker-search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Two actual Ingushetia EIS notices and original cards through real worker + SQLite + query
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_ingushetia_live_worker
