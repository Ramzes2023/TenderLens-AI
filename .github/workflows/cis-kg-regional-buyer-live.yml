name: CIS Kyrgyz village and district buyer live saved-search proof
on:
  push:
    branches: [research/cis-kg-ayil-local-buyer-20261018]
    paths:
      - scripts/ci_cis_kg_regional_buyer_live_acceptance.py
      - .github/workflows/cis-kg-regional-buyer-live.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/ci_cis_kg_regional_buyer_live_acceptance.py
      - .github/workflows/cis-kg-regional-buyer-live.yml
permissions:
  contents: read
jobs:
  kg-real-local-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify authentic public Kyrgyz buyer → queue → SQLite → saved buyer search
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHON_DOTENV_DISABLED: '1'
        run: python -B -m scripts.ci_cis_kg_regional_buyer_live_acceptance --source kg_gov_legacy
