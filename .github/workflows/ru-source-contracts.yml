name: Russian source contracts

on:
  push:
    paths:
      - "app/sources/**"
      - "app/monitoring/config.py"
      - "tests/test_ru_source_integration_contract.py"
      - ".github/workflows/ru-source-contracts.yml"
  pull_request:
    paths:
      - "app/sources/**"
      - "app/monitoring/config.py"
      - "tests/test_ru_source_integration_contract.py"
      - ".github/workflows/ru-source-contracts.yml"

permissions:
  contents: read

jobs:
  ru-source-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile integrated Russian sources
        run: python -m compileall -q app/sources tests/test_ru_source_integration_contract.py
      - name: Test Russian source contracts (offline, no host proof)
        run: python -m pytest -q tests/test_ru_source_integration_contract.py
