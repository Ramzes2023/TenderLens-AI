name: RU prelaunch Telegram catalog notifications and delivery safety

on:
  push:
    branches: [fix/ru-prelaunch-telegram-catalog-monitoring-20261018]
    paths:
      - app/monitoring/config.py
      - app/monitoring/service.py
      - app/bot/main.py
      - app/bot/monitoring.py
      - tests/test_ru_background_telegram_catalog.py
      - .github/workflows/ru-prelaunch-telegram-notifications.yml
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ru-telegram-catalog-delivery-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Offline RU opt-in, all-failure, Telegram retry, baseline, legacy EIS regression
        run: python -m pytest -q tests/test_ru_background_telegram_catalog.py tests/test_monitoring.py tests/test_bot.py tests/test_ru_source_integration_contract.py
