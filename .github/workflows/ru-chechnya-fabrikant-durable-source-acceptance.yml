name: RU Chechnya Fabrikant genuine originals to leased Worker, SQL and authenticated scoring
on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/ru_chechnya_fabrikant44.py
      - app/monitoring/config.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/scoring/runs.py
      - app/sources/ru_cycle.py
      - scripts/ci_ru_chechnya_fabrikant_real_worker.py
      - scripts/ci_ru_chechnya_fabrikant_authenticated.py
      - scripts/ci_ru_chechnya_fabrikant_telegram_query_delivery.py
      - tests/test_ru_chechnya_fabrikant44.py
      - tests/test_ru_approved_operator_cycle.py
      - .github/workflows/ru-chechnya-fabrikant-durable-source-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  chechnya-fabrikant-operator-and-publisher-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require exact Chechen INN and original, default-off operator and tenant safeguards
        run: python -m pytest -q tests/test_ru_chechnya_fabrikant44.py tests/test_ru_approved_operator_cycle.py

  chechnya-fabrikant-real-leased-worker-sql-search:
    runs-on: windows-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Native current first-party details via real fenced durable Worker and searchable isolated SQLite
        timeout-minutes: 7
        run: python -B -m scripts.ci_ru_chechnya_fabrikant_real_worker

  chechnya-fabrikant-real-signed-in-scoring-and-tenant-denial:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require genuine independently matched originals to customer scoring, tenant denied
        timeout-minutes: 8
        run: python -B -m scripts.ci_ru_chechnya_fabrikant_authenticated

  chechnya-fabrikant-real-keyword-to-local-telegram:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require native first-party numbers and user keyword with local-only ACK retry, dedup, other-customer isolation
        timeout-minutes: 9
        run: python -B -m scripts.ci_ru_chechnya_fabrikant_telegram_query_delivery
