name: RU genuine-source daily live search and tenant health
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [feat/ru-public-sources-daily-live-health-20261017]
    paths:
      - .github/workflows/ru-public-sources-daily-live-health.yml
      - tests/test_ru_daily_source_health_workflow.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ru-public-sources-daily-live-health.yml
      - tests/test_ru_daily_source_health_workflow.py
permissions:
  contents: read
concurrency:
  group: ru-public-health-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  health-workflow-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML pytest
      - name: Confirm five non-synthetic live source pipelines and read-only schedule
        run: python -m pytest -q tests/test_ru_daily_source_health_workflow.py
  b2b-center-public-signal:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Real B2B-Center notices through leased worker, disposable SQLite and keyword query
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_b2b_real_worker
      - name: Real B2B notices into customer-scoped authorized scoring
        timeout-minutes: 4
        run: python -B scripts/ci_ru_b2b_user_scoring.py
  leningrad-oblast-public-signal:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
