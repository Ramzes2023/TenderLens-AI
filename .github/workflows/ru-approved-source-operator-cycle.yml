name: RU approved source operator queue contract
on:
  push:
    branches: [feat/ru-approved-catalog-queue-cycle-20261018, feat/ru-ingushetia-eis-live-gated-20261019]
    paths:
      - app/sources/ru_cycle.py
      - app/sources/ru_ingushetia_eis44.py
      - app/sources/ru_ingushetia_fabrikant44.py
      - app/sources/enqueue.py
      - tests/test_ru_approved_operator_cycle.py
      - scripts/ru_ingushetia_hourly_enqueue.py
      - tests/test_ru_ingushetia_hourly_enqueue.py
      - .github/workflows/ru-approved-source-operator-cycle.yml
  pull_request:
    branches: [main, feat/ru-ingushetia-eis-live-gated-20261019]
permissions:
  contents: read
jobs:
  ru-approved-queue-sqlite-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Operator RU queue keeps main Samara/Dagestan plus opt-in Ingushetia, fenced SQL hourly dedup
        run: python -m pytest -q tests/test_ru_approved_operator_cycle.py tests/test_ru_ingushetia_hourly_enqueue.py tests/test_cis_operator_cycle.py tests/test_ru_kavkaz_firstparty_registration.py
