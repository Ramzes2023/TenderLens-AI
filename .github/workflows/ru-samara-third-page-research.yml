name: RU Samara third original public page research ONLY

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_samara_third_page.py
      - tests/test_ru_samara_third_page_research.py
      - app/sources/ru_samara_public_list.py
      - .github/workflows/ru-samara-third-page-research.yml

permissions:
  contents: read

concurrency:
  group: ru-samara-third-page-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-third-page-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_ru_samara_third_page_research.py

  strict-third-page-live-official:
    needs: strict-third-page-offline-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate three independently numbered ORIGINAL Samara official list pages (READ ONLY)
        timeout-minutes: 6
        run: python -B -m scripts.research_ru_samara_third_page
      - name: A successful public list is not a verified detail page or production activation
        run: |
          echo 'LIST_PAGE_2_ONLY=YES'
          echo 'INDIVIDUAL_DETAILS_VERIFIED=NO'
          echo 'PRODUCTION_CHANGED=NO'

  samara-thirty-native-page-worker-sql:
    needs: strict-third-page-live-official
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require 30 REAL official Samara records through a leased Worker, disposable SQLite and honest user search
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_samara_three_page_worker_sql
