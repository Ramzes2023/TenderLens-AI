name: RU Dagestan real anonymous browser grid contract research

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_dagestan_browser_grid.py
      - tests/test_ru_dagestan_browser_grid.py
      - .github/workflows/ru-dagestan-browser-grid-research.yml

permissions:
  contents: read

concurrency:
  group: dagestan-browser-grid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing contract only
        run: python -m pip install 'pytest>=8,<10' 'playwright==1.55.0'
      - name: Reject unsafe origins, non-public routes and sensitive form values
        run: python -m pytest -q tests/test_ru_dagestan_browser_grid.py

  real-browser-anonymous-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source browser driver
        run: python -m pip install 'playwright==1.55.0'
      - name: Install pinned Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Observe real official first-party browser query and actual JSON row shape
        timeout-minutes: 2
        run: python -B -m scripts.research_ru_dagestan_browser_grid
