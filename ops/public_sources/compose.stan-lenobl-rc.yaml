# STAN + Lenobl isolated release candidate. NEVER use the live V6 Compose project.
# Run only against an operator-verified clean checkout pinned to a reviewed commit.
# No public proxy/Caddy routing, host ports, Telegram, email, scheduler or live DB mounts.
x-rc-env: &rc-env
  PYTHON_DOTENV_DISABLED: "1"
  APP_ENV: development
  LOG_LEVEL: WARNING
  DATABASE_URL: sqlite:////app/data/isolated-public-sources.sqlite3
  VALYQON_DATABASE_REQUIRE_POSTGRES: "false"
  VALYQON_ISOLATED_PUBLIC_SOURCES_ENABLED: "true"
  DATA_DIR: /app/data
  VALYQON_PUBLIC_ANALYTICS_MODE: real
  VALYQON_RESTRICT_PAID_SOURCE_DETAILS: "true"
  VALYQON_PUBLIC_AI_ENABLED: "false"
  VALYQON_AI_FALLBACK_ENABLED: "false"
  RAG_ENABLED: "false"
  MONITORING_ENABLED: "false"
  EIS_RSS_URLS: ""
  EIS_PROFILE_FEEDS_ENABLED: "false"
  EIS_223_ENABLED: "false"
  EIS_44_HTML_ENABLED: "false"
  EIS_DIRECT_ENABLED: "false"
  EIS_SYSTEM_TRUST_ENABLED: "false"
  B2B_CENTER_ENABLED: "false"
  GPB_ETP_PUBLIC_ENABLED: "false"
  TEKTORG_PUBLIC_ENABLED: "false"
  ROSELTORG_PUBLIC_ENABLED: "false"
  RU_SAMARA_PUBLIC_LIST_ENABLED: "false"
  RU_DAGESTAN_PUBLIC_LIST_ENABLED: "false"
  KAVKAZ_RF_FIRSTPARTY_ENABLED: "false"
  LENOBL_SMALL_PUBLIC_ENABLED: "true"
  NMCK_NATIVE_PUBLIC_ENABLED: "false"
  SOUTH_URAL_PUBLIC_ENABLED: "false"
  STAN_COMMERCIAL_PUBLIC_ENABLED: "true"
  MIKROTON_TENDER_ENABLED: "false"
  VALYQON_CIS_MD_ELICITATIE_ENABLED: "false"
  VALYQON_CIS_AZ_AZERISTILIK_ENABLED: "false"
  VALYQON_CIS_AZ_ADIF_SMALL_ENABLED: "false"
  VALYQON_RU_BACKGROUND_CATALOG_ENABLED: "false"
  VALYQON_CONNECTOR_MAX_RECORDS: "3"
  VALYQON_WORKER_COUNT: "1"
  VALYQON_JOB_DEFAULT_MAX_ATTEMPTS: "2"
  OUTBOUND_PROXY_URL: ""
  GIGACHAT_CREDENTIALS: ""
  GROQ_API_KEY: ""
  TELEGRAM_BOT_TOKEN: ""
  VALYQON_EMAIL_MODE: disabled

services:
  guest-sources:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: valyqon-stan-lenobl-rc:reviewed
    command: ["uvicorn", "app.api.isolated_public_sources:app", "--host", "0.0.0.0", "--port", "8101", "--workers", "1"]
    restart: "no"
    environment:
      <<: *rc-env
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    volumes:
      - stan_lenobl_rc_data:/app/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 80
    mem_limit: 512m
    networks: [private_guest]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8101/_internal/health',timeout=3).close()"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: valyqon-stan-lenobl-rc:reviewed
    command: ["python", "-m", "app.jobs.worker", "--connectors"]
    restart: "no"
    environment:
      <<: *rc-env
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    volumes:
      - stan_lenobl_rc_data:/app/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 80
    mem_limit: 512m
    networks: [publisher_outbound]
    healthcheck:
      disable: true

  enqueue:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: valyqon-stan-lenobl-rc:reviewed
    profiles: ["manual-operator"]
    command: ["python", "-m", "app.sources.enqueue", "--source", "stan_commercial_public"]
    restart: "no"
    environment:
      <<: *rc-env
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m"]
    volumes:
      - stan_lenobl_rc_data:/app/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    network_mode: none
    healthcheck:
      disable: true

networks:
  private_guest:
    internal: true
  publisher_outbound:
    driver: bridge

volumes:
  stan_lenobl_rc_data:
