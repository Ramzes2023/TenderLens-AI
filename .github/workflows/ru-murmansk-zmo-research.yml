name: RU Murmansk first-party regional small-purchase live discovery
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_murmansk_zmo_public.py
      - scripts/diag_ru_murmansk_json.py
      - tests/test_ru_murmansk_zmo_public.py
      - .github/workflows/ru-murmansk-zmo-research.yml
  push:
    branches: [research/ru-murmansk-zmo-native-live-20261018]
    paths:
      - scripts/research_ru_murmansk_zmo_public.py
      - scripts/diag_ru_murmansk_json.py
      - tests/test_ru_murmansk_zmo_public.py
      - .github/workflows/ru-murmansk-zmo-research.yml
permissions:
  contents: read
jobs:
  murmansk-strict-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Host allowlist, two genuine original IDs, parser hostile data refusal
        run: python -m pytest -q tests/test_ru_murmansk_zmo_public.py
  murmansk-real-registry-independent-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require current first-party index with two independently fetched complete original notices
        timeout-minutes: 5
        run: python -B -m scripts.research_ru_murmansk_zmo_public
  murmansk-official-json-route-readonly-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Real official observed NoticesJson discovery endpoint, no fixture or production writes
        timeout-minutes: 4
        run: python -B -m scripts.diag_ru_murmansk_json
