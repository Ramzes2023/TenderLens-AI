name: VALYQON Public Launch Readiness (Read Only)

on:
  push:
    branches: [integration/valyqon-release-candidate-20261025]
  workflow_dispatch:
    inputs:
      public_https_url:
        description: 'Public HTTPS URL to verify; required for live edge probe'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify release script, hostname rejection, truthful gate flags
        run: python -m pytest -q tests/test_verify_public_https.py tests/test_deployment.py
      - name: Ensure public Compose is fail closed before merchant integration
        run: |
          python - <<'PY'
          from pathlib import Path
          compose=Path('compose.public.yaml').read_text(encoding='utf-8')
          caddy=Path('Caddyfile').read_text(encoding='utf-8')
          assert 'VALYQON_PUBLIC_ANALYTICS_MODE: "real"' in compose
          assert 'VALYQON_PUBLIC_ANALYTICS_MODE: "demo"' not in compose
          assert 'VALYQON_RESTRICT_PAID_SOURCE_DETAILS: "true"' in compose
          assert 'APP_ENV: production' in compose
          assert 'TENDERLENS_DOMAIN: "${TENDERLENS_DOMAIN:?' in compose
          assert 'ACME_EMAIL: "${ACME_EMAIL:?' in compose
          assert 'reverse_proxy api:8000' in caddy
          assert 'Strict-Transport-Security' in caddy
          print('STATIC_PUBLIC_EDGE_GATES=PASS')
          print('PRODUCTION_PUBLIC_DEPLOYMENT=NOT_PERFORMED')
          PY
  public-edge-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.public_https_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check true TLS, security headers and application health on supplied domain
        env:
          PUBLIC_URL: ${{ inputs.public_https_url }}
        run: |
          python -B scripts/verify_public_https.py --url "$PUBLIC_URL"
