name: Deadline Reminder Fair Scan Acceptance

on:
  push:
    branches:
      - fix/deadline-alerts-fair-scan-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deadlines-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: 'true'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Static compile and changed-file formatting
        run: |
          python -m compileall -q app/launch/deadline_alerts.py tests/test_deadline_alerts_fair_scan.py
          git diff --check origin/main...HEAD
      - name: Isolated fairness, opt-in, chronology, and privacy regressions
        run: |
          python -m pytest -q -rs tests/test_deadline_alerts_fair_scan.py tests/test_deadline_alerts_database.py tests/test_deadline_alerts_launch.py tests/test_delivery_journal.py
      - name: Assert honest bounded scan diagnostics
        run: |
          python - <<'PY'
          from app.launch.deadline_alerts import MAX_SCANNED_PER_CYCLE, MAX_REMINDERS_PER_CYCLE
          assert MAX_SCANNED_PER_CYCLE == 2000
          assert MAX_REMINDERS_PER_CYCLE == 100
          print('SCAN_LIMIT=2000; SEND_CAP=100; EXTERNAL_DELIVERY=NOT_TESTED')
          PY

  deadlines-windows:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Original worker and fair-scan tests on Windows
        run: python -m pytest -q tests/test_deadline_alerts_fair_scan.py tests/test_deadline_alerts_database.py
