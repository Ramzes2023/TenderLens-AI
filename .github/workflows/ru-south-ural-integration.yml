name: RU South Ural public small-purchase fully verified SQL and tenant acceptance
on:
  push:
    branches: [feat/ru-south-ural-small-live-sql-20261017]
    paths:
      - app/sources/south_ural_public.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/monitoring/config.py
      - app/scoring/runs.py
      - scripts/ci_ru_south_ural_real_worker.py
      - scripts/ci_ru_south_ural_authenticated.py
      - tests/test_ru_south_ural_adapter.py
      - .github/workflows/ru-south-ural-integration.yml
  pull_request:
    branches: [main]
    paths:
      - app/sources/south_ural_public.py
      - scripts/ci_ru_south_ural_real_worker.py
      - scripts/ci_ru_south_ural_authenticated.py
      - tests/test_ru_south_ural_adapter.py
  workflow_dispatch:

permissions:
  contents: read
jobs:
  south-ural-adapter-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Official URL identity and independent detail safe adapter mocks
        run: python -m pytest -q tests/test_ru_south_ural_adapter.py
  south-ural-real-leased-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Real South Ural numbered original procurement -> fenced queue -> SQLite -> query
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_south_ural_real_worker
  south-ural-real-tenant-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Real South Ural original notices -> authenticated tenant scoring & cross-tenant denial
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_south_ural_authenticated
