name: RU-03 GPB verified public detail via curl
on:
  push:
    branches: [ops/ru3-trusted-source-probe-20261016]
    paths: [.github/workflows/ru03-gpb-detail-identity.yml]
permissions: {}
jobs:
  gpb-detail:
    runs-on: valyqon-ru3
    timeout-minutes: 4
    steps:
      - name: Explicit HTTPS, no redirects, check three independent GPB detail pages
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = VALYQON-ASIA-03
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          url='https://etpgpb.ru/procedures/'
          code="$(curl --noproxy '*' --silent --show-error --proto '=https' --max-redirs 0 --connect-timeout 8 --max-time 23 --max-filesize 1800000 -o "$dir/index" -w '%{http_code}' "$url")"
          test "$code" = 200
          python3 - "$dir/index" "$dir/list" <<'PY'
          import sys,re
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlsplit
          class P(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('href'):self.links.append(a['href'])
          p=P();p.feed(open(sys.argv[1],encoding='utf-8',errors='replace').read())
          result={}
          for raw in p.links:
              u=urlsplit(urljoin('https://etpgpb.ru/procedures/',raw))
              m=re.fullmatch(r'/procedures/etp/([0-9]{5,10})-[a-z0-9-]+/',u.path)
              if m and u.scheme=='https' and u.hostname=='etpgpb.ru' and not u.fragment and not u.query:
                  result.setdefault(m.group(1),u.geturl())
          print('RU3_GPB_PUBLIC_CANONICAL_IDS='+str(len(result)))
          with open(sys.argv[2],'w') as out:
              for ident,url in list(result.items())[:3]:out.write(ident+' '+url+'\n')
          PY
          n=0
          while read -r ident detail; do
            test "$n" -lt 3
            code="$(curl --noproxy '*' --silent --show-error --proto '=https' --max-redirs 0 --connect-timeout 8 --max-time 23 --max-filesize 1800000 -o "$dir/detail$n" -w '%{http_code}' "$detail" 2>/dev/null)" && rc=0 || rc=$?
            echo "RU3_GPB_DETAIL_HTTP=$code;CURL_EXIT=$rc;PUBLIC_ID=$ident;BYTES=$(wc -c < "$dir/detail$n" | tr -d ' ')"
            if test "$rc" -eq 0 && test "$code" = 200; then
              python3 - "$dir/detail$n" "$ident" <<'PY'
          import sys
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):super().__init__();self.active=False;self.headings=[];self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='h1':self.active=True;self.parts=[]
              def handle_data(self,d):
                  if self.active:self.parts.append(d)
              def handle_endtag(self,tag):
                  if tag=='h1' and self.active:self.headings.append(' '.join(' '.join(self.parts).split()));self.active=False
          txt=open(sys.argv[1],encoding='utf-8',errors='replace').read();p=P();p.feed(txt)
          print('RU3_GPB_DETAIL_TITLE='+repr(p.headings[:2]))
          print('RU3_GPB_DETAIL_ID_MATCH='+str(sys.argv[2] in txt))
          PY
            fi
            n=$((n+1))
          done < "$dir/list"
          echo 'PRODUCTION_CHANGED=NO'
