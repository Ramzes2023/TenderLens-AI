name: RU EIS 44 official listing offline contract acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/eis_44_public_html.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/scoring/runs.py
      - tests/test_ru_eis44_public_html.py
      - .github/workflows/ru-eis44-integration.yml
  push:
    branches: [integration/ru-eis44-html-mainline-20261016]
    paths:
      - app/sources/eis_44_public_html.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/scoring/runs.py
      - tests/test_ru_eis44_public_html.py
      - .github/workflows/ru-eis44-integration.yml

permissions:
  contents: read

jobs:
  eis44-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Strict law, notice identity, official URL and scoped CA contracts
        run: python -m pytest -q tests/test_ru_eis44_public_html.py
