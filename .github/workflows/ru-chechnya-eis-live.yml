name: RU Chechnya EIS 44 regional source gated acceptance

on:
  # A push to the repository-owned feature branch can run on trusted
  # self-hosted infrastructure without a premature merge into main.
  # NEVER execute unreviewed fork pull_request code on self-hosted runners.
  push:
    branches: [feat/ru-chechnya-eis-rss-20261022]
    paths:
      - .github/workflows/ru-chechnya-eis-live.yml
      - scripts/ci_ru_chechnya_eis_real_worker.py
      - scripts/ru_chechnya_eis_transport_probe.py
      - app/sources/ru_chechnya_eis_rss.py
      - app/sources/eis_rss.py
      - tests/test_ru_chechnya_eis_rss.py
  pull_request:
    branches: [main]
    paths:
      - app/sources/ru_chechnya_eis_rss.py
      - app/sources/eis_rss.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/sources/ru_dedup.py
      - app/sources/ru_notice_identity.py
      - app/monitoring/config.py
      - app/bot/monitoring.py
      - tests/test_ru_chechnya_eis_rss.py
      - scripts/ci_ru_chechnya_eis_real_worker.py
      - scripts/ru_chechnya_windows_live.ps1
      - scripts/ru_chechnya_eis_transport_probe.py
      - .github/workflows/ru-chechnya-eis-live.yml
  workflow_dispatch:
    inputs:
      regional_rss_url:
        description: "Exact official EIS 44-FZ Chechnya-filtered RSS URL copied from EIS advanced search"
        required: true
        type: string

permissions:
  contents: read

jobs:
  chechnya-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile new source and strict live acceptance
        run: python -m compileall -q app/sources/ru_chechnya_eis_rss.py scripts/ci_ru_chechnya_eis_real_worker.py scripts/ru_chechnya_eis_transport_probe.py
      - name: Chechnya official URL, regional evidence, legal provenance, opt-in, Worker and dedup contracts
        run: python -B -m pytest -q tests/test_ru_chechnya_eis_rss.py tests/test_ru_background_telegram_catalog.py tests/test_ru_telegram_original_dedup.py
      - name: Parse trusted Windows operator launcher (no remote calls)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/ru_chechnya_windows_live.ps1).Path,
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  chechnya-real-live-worker:
    # workflow_dispatch is only discoverable once the workflow reaches the
    # default branch; until then, trusted feature-branch push is the live gate.
    # pull_request never reaches self-hosted machines.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/feat/ru-chechnya-eis-rss-20261022')
    needs: [chechnya-offline-contracts]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    env:
      RU_CHECHNYA_EIS_ENABLED: "true"
      RU_CHECHNYA_EIS_RSS_URLS: ${{ inputs.regional_rss_url || vars.VALYQON_RU_CHECHNYA_EIS_RSS_URL }}
      EIS_PROFILE_FEEDS_ENABLED: "false"
      EIS_DIRECT_ENABLED: "true"
      EIS_SYSTEM_TRUST_ENABLED: "false"
      EIS_CA_BUNDLE_FILE: ${{ vars.VALYQON_RU_EIS_CA_BUNDLE_FILE }}
      MONITORING_ENABLED: "false"
      RU_CHECHNYA_E2E_TEST_BOT_TOKEN: ""
      RU_CHECHNYA_E2E_TEST_CHAT_ID: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Select strict official EIS 44-FZ regional RSS candidate if operator URL is absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RU_CHECHNYA_EIS_RSS_URLS}" ]]; then
            RU_CHECHNYA_EIS_RSS_URLS="$(python -c 'from app.sources.eis_rss import build_eis_rss_url; print(build_eis_rss_url("Чеченская Республика"))')"
            echo "RSS_SEARCH_SCOPE=UNVERIFIED_TEXT_QUERY_CANDIDATE"
          else
            echo "RSS_SEARCH_SCOPE=OPERATOR_CONFIGURED_RSS"
          fi
          echo "RU_CHECHNYA_EIS_RSS_URLS=${RU_CHECHNYA_EIS_RSS_URLS}" >> "$GITHUB_ENV"
      - name: Official LIVE EIS -> real Worker -> SQLite -> query -> locally captured alert
        timeout-minutes: 7
        run: python -B -m scripts.ci_ru_chechnya_eis_real_worker
      - name: Safe diagnosis on failed live EIS intake (never masks failure)
        if: failure()
        timeout-minutes: 2
        run: python -B -m scripts.ru_chechnya_eis_transport_probe
