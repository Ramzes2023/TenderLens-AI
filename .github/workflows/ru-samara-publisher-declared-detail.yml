name: RU Samara Officially Disclosed Alternate Detail Research

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_samara_declared_detail_route.py
      - tests/test_research_ru_samara_declared_detail_route.py
      - .github/workflows/ru-samara-publisher-declared-detail.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-disclosed-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEGRAM_BOT_TOKEN: ''
      OUTBOUND_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict source and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reject guessed detail URLs, malicious paths and unauthenticated errors
        run: python -m pytest -q tests/test_research_ru_samara_declared_detail_route.py
      - name: Official bounded HTML→declared route→native JSON→two originals probe
        timeout-minutes: 4
        run: python -B -m scripts.research_ru_samara_declared_detail_route
      - name: Research is not a release gate
        run: |
          echo "SAMARA_SOURCE_ENABLED=NO"
          echo "WORKER_SQL_REQUIRES_INDEPENDENT_PROOF=YES"
          echo "PRODUCTION_CADDY_API_SQLITE_UNCHANGED=YES"
