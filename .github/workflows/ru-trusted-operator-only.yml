name: RU trusted self-hosted read-only diagnostic (manual main only)
run-name: RU public diagnostic - ${{ inputs.source }}
on:
  workflow_dispatch:
    inputs:
      source:
        description: Fixed approved public Russian source (read-only; no ingestion)
        type: choice
        required: true
        options:
          - b2b_office
          - fabrikant_44
          - roseltorg
          - lenobl
          - vologda
          - gpb_rss
          - rzd_eshop
          - tektorg
          - batch_priority
          - fabrikant_44_mirror
          - fabrikant_223_mirror
          - tatarstan_trading
          - samara_small
          - sverdlovsk_small
          - bashkortostan_small
          - yanao_small
          - moscow_suppliers
          - moscow_oblast_small
          - lot_online
          - rts_tomsk_small
          - rts_dagestan_small
          - rts_omsk_small
          - rts_yaroslavl_small
          - sber_berezka
          - tender_pro
          - smolensk_small
          - petrozavodsk_small
          - yaroslavl_small
          - voronezh_small
          - udmurtia_small
          - moscow_oblast_market
          - torgi_online_commercial
          - r_tender_commercial
          - dagestan_official_small
permissions:
  contents: read
jobs:
  ru-operator-trusted-only:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 6
    steps:
      # This step runs before checkout: a non-RU runner refuses to execute any repo code.
      - name: Require named RU runner
        env:
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
        run: |
          test "$ACTUAL_RUNNER_NAME" = "VALYQON-RU-01"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed-host HTTPS public procurement read-only diagnostic
        env:
          RU_SOURCE_ID: ${{ inputs.source }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m scripts.ru_trusted_live_probe "$RU_SOURCE_ID"
