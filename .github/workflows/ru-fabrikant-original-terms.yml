name: RU Fabrikant official original date and price integrity

on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/fabrikant_public_detail_terms.py
      - app/sources/ru_chechnya_fabrikant44.py
      - tests/test_fabrikant_public_detail_terms.py
      - tests/test_ru_chechnya_fabrikant44.py
      - scripts/ci_ru_fabrikant_original_deadline_terms.py
      - .github/workflows/ru-fabrikant-original-terms.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-terms-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEGRAM_BOT_TOKEN: ''
      OUTBOUND_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Original visible timestamp, Moscow offset, hidden fields, contradictions
        run: python -m pytest -q tests/test_fabrikant_public_detail_terms.py tests/test_ru_chechnya_fabrikant44.py
  original-terms-genuine-firstparty:
    runs-on: ubuntu-latest
    needs: original-terms-offline
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEGRAM_BOT_TOKEN: ''
      OUTBOUND_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Three genuine current original HTML GETs with verified deadline
        timeout-minutes: 4
        run: python -B -m scripts.ci_ru_fabrikant_original_deadline_terms
      - name: Source activation is still blocked by publisher catalogue transport
        run: |
          echo "RU_INGUSHETIA_44FZ_ENABLED=NO"
          echo "RU_CHECHNYA_44FZ_ENABLED=NO"
          echo "SOURCE_DISCOVERY_WORKER_SQL=NOT_PROVED"
          echo "PRODUCTION_CHANGED=NO"
