name: RU-03 Roseltorg live public procurement detail identity

on:
  push:
    branches: [ops/ru3-trusted-source-probe-20261016]
    paths: [.github/workflows/ru03-roseltorg-real-detail.yml]

permissions: {}

jobs:
  roseltorg-probe:
    runs-on: valyqon-ru3
    timeout-minutes: 4
    steps:
      - name: Bounded public listings and same-host detail verification
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = VALYQON-ASIA-03
          python3 - <<'PY'
          import re
          import ssl
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit

          HOST='www.roseltorg.ru'
          LIST='https://'+HOST+'/procedures/search'
          LIMIT=1_700_000
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          client=urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              NoRedirect())
          def get(url):
              p=urlsplit(url)
              if (p.scheme!='https' or p.hostname!=HOST or p.port not in (None,443)
                      or p.username or p.password or p.fragment):
                  raise ValueError('Off-host or unsafe URL')
              req=urllib.request.Request(url,headers={'Accept':'text/html'})
              with client.open(req,timeout=16) as resp:
                  if resp.status!=200 or 'html' not in resp.headers.get('Content-Type','').lower():
                      raise ValueError('Not public HTTP 200 HTML')
                  payload=resp.read(LIMIT+1)
              if not payload or len(payload)>LIMIT:
                  raise ValueError('Empty or oversized page')
              return payload.decode('utf-8','replace')
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links=[];self.current=None;self.headings=[];self.heading=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('href'):
                      self.current=[a['href'],[]]
                  if tag in ('h1','h2') and self.heading is None:
                      self.heading=[tag,[]]
              def handle_data(self,data):
                  if self.current:self.current[1].append(data)
                  if self.heading:self.heading[1].append(data)
              def handle_endtag(self,tag):
                  if tag=='a' and self.current:
                      self.links.append((self.current[0],' '.join(' '.join(self.current[1]).split())))
                      self.current=None
                  if self.heading and tag==self.heading[0]:
                      self.headings.append((tag,' '.join(' '.join(self.heading[1]).split())[:150]))
                      self.heading=None
          listing=get(LIST);p=Parser();p.feed(listing)
          selected={}
          for href,text in p.links:
              u=urlsplit(urljoin(LIST,href))
              if u.scheme!='https' or u.hostname!=HOST or u.query or u.fragment:continue
              m=re.fullmatch(r'/procedure/([A-Za-z0-9]{5,32})/1/?',u.path)
              if m:selected.setdefault(m.group(1),(u.geturl(),text))
          print('RU3_ROSELTORG_PUBLIC_LISTING_IDS='+str(len(selected)))
          ok=0
          for ident,(url,anchor) in list(selected.items())[:5]:
              try:
                  doc=get(url)
                  headings=Parser();headings.feed(doc)
                  confirmed=ident in doc
                  print('RU3_ROSELTORG_DETAIL_ID='+ident+';HTTP=200;ID_MATCH='+str(confirmed)+';H1_H2='+repr(headings.headings[:5])+';ANCHOR='+repr(anchor[:110]))
                  if confirmed and any(len(text)>10 for tag,text in headings.headings if tag=='h1'):
                      ok+=1
              except Exception as e:
                  print('RU3_ROSELTORG_DETAIL_ID='+ident+';FAILED_CLASS='+type(e).__name__)
          print('RU3_ROSELTORG_DETAIL_VERIFIED='+str(ok))
          print('RU3_ROSELTORG_APP_DB_VERIFIED=NO')
          print('RU3_ROSELTORG_PRODUCTION_CHANGED=NO')
          PY
