name: CIS Armenia and Tajikistan real ingestion acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/sources/**"
      - "app/jobs/**"
      - "scripts/ci_cis_am_tj_live_acceptance.py"
      - ".github/workflows/cis-am-tj-live-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-source-to-sqlite:
    name: Live end-to-end / ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        source: [am_armeps, tj_eprocurement]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test environment
        run: python -m pip install -r requirements-dev.txt
      - name: Verify actual official HTTPS to job to isolated SQLite to snapshot
        timeout-minutes: 4
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHON_DOTENV_DISABLED: "1"
        run: python -B scripts/ci_cis_am_tj_live_acceptance.py --source "${{ matrix.source }}"
