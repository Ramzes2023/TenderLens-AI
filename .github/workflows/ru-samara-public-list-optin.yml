name: RU Samara public list E2E opt-in acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/ru_samara_public_list.py
      - app/sources/catalog.py
      - app/sources/ingestion.py
      - app/monitoring/config.py
      - scripts/ci_ru_samara_public_list_sql.py
      - scripts/ci_ru_samara_authenticated.py
      - scripts/ci_ru_samara_telegram_query_delivery.py
      - app/sources/ru_cycle.py
      - tests/test_ru_samara_operator_queue.py
      - tests/test_ru_samara_public_list.py
      - .github/workflows/ru-samara-public-list-optin.yml

permissions:
  contents: read

concurrency:
  group: ru-samara-public-list-optin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-adapter-and-disabled-default:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test only public native Samara list is accepted and explicit flag gates source
        run: python -m pytest -q tests/test_ru_samara_public_list.py tests/test_ru_samara_operator_queue.py

  real-native-list-worker-sql-title-keyword:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Prove actual first-party list from real HTTP -> leased fenced worker -> disposable SQLite -> keyword user search
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_samara_public_list_sql

  real-public-list-authenticated-tenant-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify real public-list Samara notice reaches signed-in scoring and cross-tenant access denied
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_samara_authenticated

  real-samara-keyword-to-local-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Prove real native Samara notices pass request keyword filter and local in-memory Telegram send/dedup
        timeout-minutes: 8
        run: python -B -m scripts.ci_ru_samara_telegram_query_delivery
