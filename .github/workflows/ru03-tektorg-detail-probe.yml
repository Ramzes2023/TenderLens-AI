name: RU-03 TEK-Torg live notice detail probe

on:
  push:
    branches: [ops/ru3-trusted-source-probe-20261016]
    paths: [.github/workflows/ru03-tektorg-detail-probe.yml]

permissions: {}

jobs:
  tektorg-public:
    runs-on: valyqon-ru3
    timeout-minutes: 4
    steps:
      - name: Compare real listing links with official same-host detail pages
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = VALYQON-ASIA-03
          python3 - <<'PY'
          import re
          import ssl
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit

          HOST = 'www.tektorg.ru'
          URL = f'https://{HOST}/223-fz/procedures'
          MAX = 1_500_000
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          client = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              NoRedirect())
          def fetch(url):
              p=urlsplit(url)
              if (p.scheme!='https' or p.hostname != HOST or p.username or p.password
                      or p.port not in (None, 443) or p.fragment):
                  raise ValueError('Unapproved host')
              with client.open(urllib.request.Request(url,headers={'Accept':'text/html'}),timeout=15) as response:
                  if response.status!=200 or 'html' not in response.headers.get('Content-Type','').lower():
                      raise ValueError('No public HTML detail')
                  data=response.read(MAX+1)
              if not data or len(data)>MAX:
                  raise ValueError('Oversized listing')
              return data.decode('utf-8','replace')

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active=None
                  self.records=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and self.active is None:
                      href=a.get('href','')
                      absolute=urlsplit(urljoin(URL,href))
                      m=re.fullmatch(r'/223-fz/procedures/([0-9]{5,15})/?',absolute.path)
                      if (m and absolute.hostname==HOST and absolute.scheme=='https'
                              and not absolute.query and not absolute.fragment):
                          self.active=[m.group(1),absolute.geturl(),[]]
              def handle_data(self,data):
                  if self.active:
                      self.active[2].append(data)
              def handle_endtag(self,tag):
                  if tag=='a' and self.active:
                      ident,url,text=self.active
                      self.records.append((ident,url,' '.join(' '.join(text).split())))
                      self.active=None
          listing=fetch(URL)
          parser=Links()
          parser.feed(listing)
          unique={}
          for identity,url,text in parser.records:
              unique.setdefault(identity,(url,text))
          print('RU3_TEKTORG_UNIQUE_PROCEDURE_IDS='+str(len(unique)))
          for identity,(url,text) in list(unique.items())[:6]:
              print(f'RU3_TEKTORG_ANCHOR_ID={identity};TEXT_CHARS={len(text)};TEXT_PREVIEW={text[:130]!r}')
          verified=0
          for identity,(url,text) in list(unique.items())[:5]:
              try:
                  detail=fetch(url)
              except Exception as error:
                  print(f'RU3_TEKTORG_DETAIL_ID={identity};REQUEST_FAILURE_CLASS={type(error).__name__}')
                  continue
              if identity not in detail:
                  print(f'RU3_TEKTORG_DETAIL_ID={identity};IDENTITY_MISMATCH=YES')
                  continue
              class Titles(HTMLParser):
                  def __init__(self):
                      super().__init__(); self.active=None; self.blocks=[]
                  def handle_starttag(self,tag,attrs):
                      if tag in ('h1','h2','title'): self.active=[tag,[]]
                  def handle_data(self,data):
                      if self.active: self.active[1].append(data)
                  def handle_endtag(self,tag):
                      if self.active and tag==self.active[0]:
                          self.blocks.append((tag,' '.join(' '.join(self.active[1]).split())[:170]))
                          self.active=None
              titles=Titles(); titles.feed(detail)
              print(f'RU3_TEKTORG_DETAIL_ID={identity};HTTP=200;TITLE_FIELDS={titles.blocks[:5]!r};BYTES={len(detail.encode())}')
              verified+=1
          print(f'RU3_TEKTORG_DETAIL_IDS_OBSERVED={verified}')
          print('RU3_TEKTORG_REAL_APP_INGESTION=NOT_YET_VERIFIED')
          print('PRODUCTION_CHANGED=NO')
          PY
