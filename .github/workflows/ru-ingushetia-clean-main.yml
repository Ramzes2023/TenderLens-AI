name: Ingushetia isolated original tender acceptance on main
on:
  pull_request:
    branches: [main]
    paths:
      - "app/sources/ru_ingushetia_*.py"
      - "app/sources/eis_pinned_ca.py"
      - "app/sources/catalog.py"
      - "app/sources/ingestion.py"
      - "app/sources/ru_cycle.py"
      - "app/sources/ru_notice_identity.py"
      - "app/monitoring/config.py"
      - "tests/test_ru_ingushetia_*.py"
      - "tests/test_ru_approved_operator_cycle.py"
      - "scripts/ci_ru_ingushetia*.py"
      - ".github/workflows/ru-ingushetia-clean-main.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingushetia-main-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Strict source provenance, SQL queue, preview and identity tests
        run: python -m pytest -q tests/test_ru_ingushetia_eis44.py tests/test_ru_ingushetia_fabrikant44.py tests/test_ru_approved_operator_cycle.py tests/test_ru_source_integration_contract.py tests/test_source_catalog.py tests/test_connector_workers.py
  ingushetia-main-live-originals:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Actual first-party regional publisher → original → Worker → isolated SQL → tenant search → fake sink
        run: python -B -m scripts.ci_ru_ingushetia_live_worker
