name: RU Dagestan public list E2E opt-in acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - app/sources/ru_dagestan_public_list.py
      - scripts/ci_ru_dagestan_public_list_sql.py
      - tests/test_ru_dagestan_public_list.py

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru-dag-public-list-optin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-adapter-and-disabled-default:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test only public native Dagestan list is accepted and explicit flag gates source
        run: python -m pytest -q tests/test_ru_dagestan_public_list.py

  real-native-list-worker-sql-title-keyword:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Prove actual first-party list from real HTTP -> leased fenced worker -> disposable SQLite -> keyword user search
        timeout-minutes: 6
        run: python -B -m scripts.ci_ru_dagestan_public_list_sql
