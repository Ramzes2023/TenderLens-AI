name: RU Real Worker to Guest HTTP Evidence

# Test-only pull request: official public HTTPS GET, fenced Worker + ephemeral DB.
# No production writes, payment, Telegram, user credentials or mail delivery.
on:
  push:
    branches:
      - test/ru-real-worker-guest-http-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-origin-worker-guest-api:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CI: 'true'
      PYTHON_DOTENV_DISABLED: '1'
      VALYQON_DATABASE_REQUIRE_POSTGRES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app and E2E test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ensure real-only integration script compiles
        run: python -m compileall -q scripts/ci_ru_mikroton_guest_http_acceptance.py
      - name: Check existing guest redaction and worker tenant contracts
        run: |
          python -m pytest -q tests/test_guest_search_public_gate.py tests/test_ru_mikroton_worker_contract.py
      - name: Real official source → Worker → temporary SQL → actual guest HTTP
        timeout-minutes: 8
        run: python -B scripts/ci_ru_mikroton_guest_http_acceptance.py
