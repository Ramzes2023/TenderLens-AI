name: RU Samara actual public list daily Worker, tenant and local delivery health

on:
  schedule:
    - cron: '13 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ru-samara-public-list-daily-health.yml
      - tests/test_ru_samara_daily_health_workflow.py
      - scripts/ci_ru_samara_public_list_sql.py
      - scripts/ci_ru_samara_authenticated.py
      - scripts/ci_ru_samara_telegram_query_delivery.py
      - app/sources/ru_samara_public_list.py

permissions:
  contents: read

concurrency:
  group: ru-samara-public-list-health-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  samara-health-workflow-adversarial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7'
      - name: Verify safe daily Samara public-list real-read health contract
        run: python -B -m pytest -q tests/test_ru_samara_daily_health_workflow.py

  samara-real-list-to-sql-authenticated-tenant-and-local-alert:
    # Default branch alone is eligible for manually triggered health runs.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Require genuine official Samara rows through leased Worker, disposable SQLite and keyword lookup
        timeout-minutes: 5
        run: python -B -m scripts.ci_ru_samara_public_list_sql
      - name: Require genuine Samara purchase to reach signed-in company scoring without cross-tenant disclosure
        timeout-minutes: 5
        run: python -B -m scripts.ci_ru_samara_authenticated
      - name: Require real Samara keyword match and local capture, without contacting Telegram users
        timeout-minutes: 5
        run: python -B -m scripts.ci_ru_samara_telegram_query_delivery
      - name: Publish exact limits of the proof
        run: |
          echo 'PUBLIC_LIST_ONLY=YES'
          echo 'INDEPENDENT_NOTICE_DETAILS_PROVED=NO'
          echo 'ACTUAL_TELEGRAM_MESSAGE_DELIVERED=NO'
          echo 'PRODUCTION_ACTIVATION=NO'
