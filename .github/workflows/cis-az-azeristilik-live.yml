name: CIS Azerbaijan state heating procurement live evidence

on:
  push:
    branches:
      - integration/cis-az-azeristilik-official-20261016
    paths:
      - scripts/ci_cis_az_azeristilik_public.py
      - .github/workflows/cis-az-azeristilik-live.yml
  pull_request:
    paths:
      - scripts/ci_cis_az_azeristilik_public.py
      - .github/workflows/cis-az-azeristilik-live.yml

permissions:
  contents: read

jobs:
  official-az-agency-live-list-and-details:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify official 2026 Azerbaijani agency notices and submission deadlines
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B scripts/ci_cis_az_azeristilik_public.py
