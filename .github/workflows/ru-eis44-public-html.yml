name: RU official EIS 44-FZ public HTML ingestion

on:
  pull_request:
    branches: [main]
    paths:
      - "app/sources/eis_44_public_html.py"
      - "app/sources/catalog.py"
      - "app/sources/ingestion.py"
      - "app/scoring/runs.py"
      - "tests/test_ru_eis44_public_html.py"
      - ".github/workflows/ru-eis44-public-html.yml"
  push:
    branches: [feat/ru-eis44-public-html-20261016]
    paths:
      - "app/sources/eis_44_public_html.py"
      - "tests/test_ru_eis44_public_html.py"
      - "scripts/ci_ru_eis44_html_worker.py"
      - ".github/workflows/ru-eis44-public-html.yml"

permissions:
  contents: read

jobs:
  eis44-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Official law, strict HTTPS and notice identity contracts
        run: python -m pytest -q tests/test_ru_eis44_public_html.py

  eis44-live-listing-worker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Acquire vetted Ministry of Digital Development app-only CA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eis-ca"
          for item in root sub; do
            case "$item" in
              root) file=russian_trusted_root_ca; pin=d26d2d0231b7c39f92cc738512ba54103519e4405d68b5bd703e9788ca8ecf31 ;;
              sub) file=russian_trusted_sub_ca; pin=bbbde2103e790b999ec62bd03cf625a5a2e7c316e10afe6a490eedead8b3fd9b ;;
            esac
            curl --noproxy '*' --fail --silent --show-error --proto '=https' --max-redirs 0 --connect-timeout 8 --max-time 20 --max-filesize 65536 -o "$RUNNER_TEMP/eis-ca/$item.crt" "https://gu-st.ru/content/Other/doc/$file.cer"
            openssl x509 -in "$RUNNER_TEMP/eis-ca/$item.crt" -out "$RUNNER_TEMP/eis-ca/$item.pem"
            actual="$(openssl x509 -in "$RUNNER_TEMP/eis-ca/$item.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test "$actual" = "$pin"
          done
          openssl verify -CAfile "$RUNNER_TEMP/eis-ca/root.pem" "$RUNNER_TEMP/eis-ca/sub.pem"
          cat "$RUNNER_TEMP/eis-ca/root.pem" "$RUNNER_TEMP/eis-ca/sub.pem" > "$RUNNER_TEMP/eis-ca/eis-only.pem"
          echo 'EIS_44_APP_CA=PINNED_SHA256'
          echo 'SYSTEM_TRUST_STORE_MODIFIED=NO'
      - name: Strict real official HTML → app worker → disposable SQLite → search
        timeout-minutes: 3
        env:
          MONITORING_ENABLED: "false"
          VALYQON_EMAIL_MODE: "disabled"
        shell: bash
        run: |
          set -euo pipefail
          export VALYQON_RU_EIS_CA_CERT="$RUNNER_TEMP/eis-ca/eis-only.pem"
          python -B -m scripts.ci_ru_eis44_html_worker
          echo 'EIS_44_HTML_INDEPENDENT_DETAIL=NOT_VERIFIED'
          echo 'PRODUCTION_CHANGED=NO'
