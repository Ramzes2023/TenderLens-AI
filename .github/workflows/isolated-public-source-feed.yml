name: Isolated Public Source Feed Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - app/api/isolated_public_sources.py
      - ops/public_sources/**
      - scripts/verify_isolated_public_source_release.py
      - tests/test_isolated_public_sources.py
      - .github/workflows/isolated-public-source-feed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Anonymous HTTP + isolated storage + expired/archived release gates
        run: python -m pytest -q tests/test_isolated_public_sources.py tests/test_guest_search_public_gate.py
      - name: Docker Compose contract — cannot recreate original Caddy/API or mount prod SQLite
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile operator -p valyqon-public-sources \
            -f ops/public_sources/compose.yaml config --format json > /tmp/source-feed-resolved.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/source-feed-resolved.json'))
          services=data['services']
          assert set(services)=={'guest-sources','worker','enqueue'}
          assert all(not svc.get('ports') for svc in services.values())
          assert all(svc.get('read_only') is True for svc in services.values())
          assert all(svc.get('environment',{}).get('VALYQON_ISOLATED_PUBLIC_SOURCES_ENABLED')=='true' for svc in services.values())
          assert all(svc['environment'].get('DATABASE_URL')=='sqlite:////app/data/isolated-public-sources.sqlite3' for svc in services.values())
          assert all(svc['environment'].get('MONITORING_ENABLED')=='false' for svc in services.values())
          assert all(svc['environment'].get('TELEGRAM_BOT_TOKEN')=='' for svc in services.values())
          assert services['enqueue']['network_mode']=='none'
          assert not services['guest-sources'].get('depends_on')
          assert all(not config.get('external') for config in data['volumes'].values())
          assert len(data['volumes'])==1
          assert any(v.get('name')=='tenderlens-vps_edge' and v.get('external') for v in data['networks'].values())
          assert services['guest-sources']['command'][-1]=='172.30.19.2'
          print('ISOLATED_PUBLIC_SOURCE_COMPOSE=PASS')
          print('PRODUCTION_DB_AND_API_CHANGED=NO')
          PY

  real-original-to-disposable-guest-http:
    runs-on: ubuntu-latest
    needs: isolated-source-contract
    timeout-minutes: 19
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TELEGRAM_BOT_TOKEN: ''
      OUTBOUND_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Genuine HTTPS MikroTon original to fenced Worker, SQLite and guest HTTP
        timeout-minutes: 7
        run: python -B scripts/ci_ru_mikroton_guest_http_acceptance.py
