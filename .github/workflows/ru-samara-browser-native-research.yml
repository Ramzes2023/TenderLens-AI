name: RU Samara genuine public browser list research

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/research_ru_samara_browser_grid.py
      - tests/test_ru_samara_browser_grid.py
      - scripts/research_ru_samara_native_http.py
      - tests/test_ru_samara_native_http.py
      - scripts/research_ru_samara_native_details.py
      - tests/test_ru_samara_native_details.py
      - scripts/research_ru_samara_browser_originals.py
      - tests/test_ru_samara_browser_originals.py
      - scripts/research_ru_samara_disclosed_notice_route.py
      - scripts/research_ru_samara_browser_disclosed_notice.py
      - tests/test_ru_samara_disclosed_notice_route.py
      - .github/workflows/ru-samara-browser-native-research.yml

permissions:
  contents: read

concurrency:
  group: samara-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samara-browser-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test driver
        run: python -m pip install 'pytest>=8,<10'
      - name: Reject fake, external and unbounded procurement cards
        run: python -B -m pytest -q tests/test_ru_samara_browser_grid.py

  samara-browser-genuine-native-list:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine Chromium browser for this research only
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Verify first-party Samara native rows without authentication or fabricated details
        timeout-minutes: 2
        run: python -B -m scripts.research_ru_samara_browser_grid

  samara-native-http-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited offline dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify public JSON request rejects forged, empty or unsafe responses
        run: python -B -m pytest -q tests/test_ru_samara_native_http.py

  samara-native-http-genuine-public-list:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited runtime
        run: python -m pip install -r requirements-dev.txt
      - name: Require real Samara anonymous GET + native CSRF JSON POST
        timeout-minutes: 3
        run: python -B -m scripts.research_ru_samara_native_http

  samara-native-original-details-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject login pages and inconsistent number/title/buyer on independent original details
        run: python -B -m pytest -q tests/test_ru_samara_native_details.py

  samara-native-two-independent-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Demand two genuine current official native list-origin details before claiming full integration
        timeout-minutes: 5
        run: python -B -m scripts.research_ru_samara_native_details

  samara-browser-two-independent-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strictly isolated Chromium research driver
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Reject duplicates, auth redirects and forged list-origin detail links
        run: python -B -m pytest -q tests/test_ru_samara_browser_originals.py
      - name: Demand two genuine independently readable current Samara original pages in same anonymous browser session
        timeout-minutes: 6
        run: python -B -m scripts.research_ru_samara_browser_originals

  samara-current-official-disclosed-notice-link:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject guessed endpoints and noncanonical source IDs in offline tests
        run: python -B -m pytest -q tests/test_ru_samara_disclosed_notice_route.py
      - name: Try only currently disclosed original Samara Notice route and two real current public listing IDs
        timeout-minutes: 5
        run: python -B -m scripts.research_ru_samara_disclosed_notice_route

  samara-browser-two-disclosed-notice-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only first-party Chromium driver
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Require first-party route disclosure and reject forged notice IDs
        run: python -B -m pytest -q tests/test_ru_samara_disclosed_notice_route.py tests/test_ru_samara_browser_originals.py
      - name: Demand two authentic independently readable Samara Notice pages after real current JSON listing
        timeout-minutes: 6
        run: python -B -m scripts.research_ru_samara_browser_disclosed_notice
