name: Japan JETRO bids source acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "app/sources/jp_jetro_bid_rss.py"
      - "tests/test_jp_jetro_bid_rss.py"
      - "scripts/asia_jetro_bid_worker_acceptance.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jp-jetro-bid-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: JETRO source and shared six-source regression
        run: python -m pytest -q tests/test_jp_jetro_bid_rss.py tests/test_asia_public_sources.py tests/test_source_catalog.py tests/test_connector_workers.py
  jp-jetro-bid-real-worker-sqlite:
    runs-on: ubuntu-latest
    needs: [jp-jetro-bid-offline-contracts]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Real official JETRO bid -> queue -> worker -> SQLite -> keyword search
        env:
          VALYQON_ASIA_JETRO_BID_ENABLED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.asia_jetro_bid_worker_acceptance
