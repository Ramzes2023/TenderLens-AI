name: RU STAN-Torgi commercial tenders independent detail probe
on:
  push:
    branches: [research/ru-stan-commercial-20261017]
    paths:
      - scripts/research_ru_stan_commercial.py
      - tests/test_ru_stan_commercial.py
      - .github/workflows/ru-stan-commercial-probe.yml
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  stan-commercial-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject EIS mirrors, foreign links and invalid independent detail
        run: python -m pytest -q tests/test_ru_stan_commercial.py
  stan-commercial-real-network:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Real public native commercial STAN list and two corroborated details
        timeout-minutes: 4
        run: python -B -m scripts.research_ru_stan_commercial
